name: Deploy Roadster to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'roadster-escape-toll/**'
      - 'scripts/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-pages-roadster
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not configured, skipping Cloudflare Pages deploy."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        run: npm ci

      - name: Validate project index and screenshots
        if: steps.creds.outputs.ready == 'true'
        run: npm test

      - name: Build shared GitHub entry
        if: steps.creds.outputs.ready == 'true'
        run: npm run build:pages

      # Cloudflare 会把静态资源的 Cache-Control 抬到 4 小时且部署不清缓存，
      # 给资源加上提交哈希作为查询串，URL 一变就绕开旧缓存。
      - name: Stamp asset version
        if: steps.creds.outputs.ready == 'true'
        env:
          SHA: ${{ github.sha }}
        run: |
          node -e '
          const fs = require("fs");
          const p = "_site/roadster-escape-toll/index.html";
          const v = process.env.SHA.slice(0, 8);
          let s = fs.readFileSync(p, "utf8");
          for (const f of ["game.js", "roadster-model.js", "style.css", "visual.css", "assets/escape-cover.webp", "assets/escape-cover-tall.webp"]) {
            s = s.split("\"./" + f + "\"").join("\"./" + f + "?v=" + v + "\"");
          }
          fs.writeFileSync(p, s);
          console.log("stamped", v);
          '

      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site/roadster-escape-toll --project-name roadster --branch main
