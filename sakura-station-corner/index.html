<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>樱花街角 · 电车与便利店</title>
    <style>
      :root {
        --boot-bg: #dfeaf3;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--boot-bg);
      }
      body {
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        cursor: grab;
      }
      body.is-grabbing {
        cursor: grabbing;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      /* 装配期唯一的画面外元素。首帧画出来就整块从 DOM 里摘掉（见 src/core/boot-screen.js），
         所以成品画面仍然零 UI：截图工具、以及任何一次正常访问的最终状态里都不会出现它。 */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--boot-bg);
        pointer-events: none;
        transition: opacity 0.55s ease;
      }
      #boot.is-done {
        opacity: 0;
      }
      .boot-title {
        font: 500 13px/1.6 "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
        letter-spacing: 0.34em;
        text-indent: 0.34em;
        color: #5c6b78;
      }
      .boot-track {
        position: relative;
        width: 240px;
        height: 1px;
        margin: 18px 0 10px;
        background: rgba(92, 107, 120, 0.2);
        overflow: hidden;
      }
      .boot-track i {
        position: absolute;
        inset: 0;
        display: block;
        transform: scaleX(0);
        transform-origin: 0 50%;
        background: #d9879f;
        transition: transform 0.18s linear;
      }
      .boot-meta {
        display: flex;
        justify-content: space-between;
        width: 240px;
        font: 400 10px/1.5 ui-monospace, "SFMono-Regular", Consolas, monospace;
        letter-spacing: 0.12em;
        color: rgba(92, 107, 120, 0.72);
      }
      /* 天气控件：常驻可见，指针离开时压到低对比度。
         「成品画面零 UI」的第二次让步（第一次是上面的加载层），这次是用户明确要的。
         配色分亮/暗两套，由当前天气的 DARK 标记切换 —— 夜景上顶着一个白药丸会很刺眼。 */
      #wxbar {
        position: fixed;
        left: 50%;
        bottom: 26px;
        transform: translateX(-50%);
        display: flex;
        gap: 2px;
        padding: 3px;
        border-radius: 999px;
        background: rgba(252, 253, 255, 0.4);
        border: 1px solid rgba(92, 107, 120, 0.16);
        opacity: 0.42;
        transition: opacity 0.35s ease, background 0.5s ease, border-color 0.5s ease;
        -webkit-backdrop-filter: blur(7px);
        backdrop-filter: blur(7px);
      }
      #wxbar:hover,
      #wxbar:focus-within {
        opacity: 1;
      }
      .wx {
        appearance: none;
        -webkit-appearance: none;
        border: 0;
        background: transparent;
        border-radius: 999px;
        padding: 7px 13px 6px;
        font: 500 12px/1 "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
        letter-spacing: 0.1em;
        color: #5c6b78;
        cursor: pointer;
        transition: color 0.25s ease, background 0.25s ease;
      }
      .wx:hover {
        color: #2f3b46;
        background: rgba(255, 255, 255, 0.6);
      }
      .wx.is-on {
        color: #b8536f;
        background: rgba(255, 255, 255, 0.75);
      }
      #wxbar.is-dark {
        background: rgba(16, 22, 34, 0.5);
        border-color: rgba(214, 226, 240, 0.16);
      }
      #wxbar.is-dark .wx {
        color: #9fb0c4;
      }
      #wxbar.is-dark .wx:hover {
        color: #e6eef6;
        background: rgba(255, 255, 255, 0.1);
      }
      #wxbar.is-dark .wx.is-on {
        color: #f2a9be;
        background: rgba(255, 255, 255, 0.13);
      }
      /* 右上角帧率读数（src/core/fps-hud.js）。pointer-events: none —— 读数永远不该
         挡住拖拽观景。默认显示，?fps=0 关掉；实拍/像素基线走的是关掉的那条路。 */
      #fps {
        position: fixed;
        top: 14px;
        right: 16px;
        padding: 3px 8px;
        border-radius: 7px;
        font: 400 11px/1.5 ui-monospace, "SFMono-Regular", Consolas, monospace;
        letter-spacing: 0.06em;
        color: rgba(58, 70, 82, 0.86);
        background: rgba(252, 253, 255, 0.3);
        -webkit-backdrop-filter: blur(5px);
        backdrop-filter: blur(5px);
        opacity: 0.82;
        pointer-events: none;
        transition: color 0.5s ease, background 0.5s ease;
        white-space: nowrap;
      }
      #fps .fps-val {
        font-weight: 600;
      }
      /* 次要字段的可见度要连着容器一起算：容器自身还有 0.82 不透明度，
         叠下来 0.45 的灰在夜景上基本糊掉（第一版实测如此）。 */
      #fps .fps-dim {
        color: rgba(58, 70, 82, 0.62);
      }
      /* 掉到 25 fps 以下时读数自己变醒目一点：需要被看见的正是这个区间 */
      #fps.is-low .fps-val {
        color: #b8536f;
      }
      #fps.is-dark {
        color: rgba(222, 232, 244, 0.94);
        background: rgba(16, 22, 34, 0.52);
      }
      #fps.is-dark .fps-dim {
        color: rgba(222, 232, 244, 0.78);
      }
      #fps.is-dark.is-low .fps-val {
        color: #f2a9be;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="wxbar" aria-label="天气"></div>
    <div id="fps" aria-hidden="true"></div>
    <div id="boot">
      <div class="boot-inner">
        <div class="boot-title">樱花街角</div>
        <div class="boot-track"><i data-fill></i></div>
        <div class="boot-meta"><span data-cap>启动引擎</span><span data-pct>0%</span></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
