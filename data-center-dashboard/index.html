<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#04080f">
<title>DC-01 · 机房运行态势</title>
<style>
:root {
  color-scheme: dark;
  --base: #04080f;
  --panel: #08111c;
  --deep: #060e19;
  --line: #1d3347;
  --subline: #15283b;
  --text: #d9e9f4;
  --muted: #91a8bd;
  --soft: #67829a;
  --cyan: #22d3ee;
  --green: #39d6ad;
  --yellow: #f2cd68;
  --orange: #f49855;
  --red: #fb6578;
  --mono: "Cascadia Mono", Consolas, "Microsoft YaHei", monospace;
  font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
body { background: #02050a; color: var(--text); }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
button:not(:disabled) { cursor: pointer; }
[hidden] { display: none !important; }
#dashboard {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 1920px;
  height: 1080px;
  display: grid;
  grid-template-rows: 68px 85px minmax(0, 1fr) 208px 26px;
  gap: 10px;
  padding: 0 24px;
  overflow: hidden;
  background: radial-gradient(ellipse at 51% 29%, #091423 0%, var(--base) 72%);
  transform-origin: center;
}
.topbar {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  border-bottom: 1px solid #223647;
}
.brand { display: flex; align-items: center; gap: 14px; }
.brand-mark {
  width: 36px; height: 36px; padding: 6px;
  display: grid; gap: 3px;
  color: var(--cyan); border: 1px solid #24586d;
  background: #0a2230;
  clip-path: polygon(0 0, 76% 0, 100% 24%, 100% 100%, 0 100%);
}
.brand-mark i { position: relative; display: block; border: 1px solid currentColor; opacity: .85; }
.brand-mark i::after { content: ""; position: absolute; width: 2px; height: 2px; background: currentColor; right: 3px; top: 1px; }
.brand h1 { font-size: 26px; font-weight: 700; letter-spacing: .07em; margin: 0; line-height: 1.12; }
.brand p { color: var(--muted); margin: 5px 0 0; font: 11px var(--mono); letter-spacing: .16em; }
.mode-nav {
  display: flex; align-items: stretch; gap: 3px; padding: 3px;
  background: #060d17; border: 1px solid var(--line); border-radius: 5px;
}
.mode-nav button {
  display: flex; align-items: center; justify-content: center; gap: 9px;
  width: 111px; height: 35px; padding: 0 8px;
  background: transparent; border: 1px solid transparent; border-radius: 3px;
  color: #adc0cf; font-size: 14px; letter-spacing: .07em;
}
.mode-nav button:hover, .view-nav button:hover { background: #112437; color: #e4f5ff; }
.mode-nav button[aria-pressed="true"] {
  color: #96f2ff; border-color: #28667b;
  background: linear-gradient(180deg,#163546,#102834);
  box-shadow: inset 0 -2px 0 #22d3ee9c;
}
.mode-icon { display: inline-block; position: relative; width: 16px; height: 16px; color: var(--cyan); opacity: .8; }
.mode-icon.therm::before { content: ""; position: absolute; left: 6px; top: 1px; width: 4px; height: 10px; border: 1px solid; border-radius: 6px; }
.mode-icon.therm::after { content: ""; position: absolute; left: 5px; bottom: 1px; width: 6px; height: 6px; background: currentColor; border-radius: 50%; }
.mode-icon.load { background: linear-gradient(currentColor,currentColor) 1px 100% / 3px 40%, linear-gradient(currentColor,currentColor) 6px 100% / 3px 63%, linear-gradient(currentColor,currentColor) 11px 100% / 3px 87%; background-repeat: no-repeat; height: 13px; }
.mode-icon.amp { background: currentColor; clip-path: polygon(56% 1%, 18% 58%, 46% 58%, 37% 100%, 82% 37%, 54% 37%); }
.mode-icon.flow::before, .mode-icon.flow::after { content: ""; position: absolute; inset: 3px 0 auto; height: 6px; background: currentColor; clip-path: polygon(0 40%, 68% 40%, 68% 0, 100% 50%, 68% 100%, 68% 65%, 0 65%); }
.mode-icon.flow::after { top: 9px; transform: scaleX(-1); }
.snapshot { display: flex; justify-content: flex-end; align-items: center; gap: 13px; }
.snapshot time { color: var(--muted); font: 13px var(--mono); letter-spacing: .03em; }
.demo {
  padding: 6px 9px; border: 1px solid #25574f; background: #0c221f;
  border-radius: 3px; color: #a3e6d2; font-size: 12px;
  display: inline-flex; gap: 7px; align-items: center;
}
.dot { width: 6px; height: 6px; display: inline-block; flex: 0 0 auto; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
.kpis { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 10px; }
.kpi, .panel {
  background: linear-gradient(150deg, #0b1624, #08111c 66%);
  border: 1px solid var(--line);
  min-width: 0; min-height: 0;
}
.kpi {
  position: relative; display: grid; grid-template-columns: 1fr auto;
  align-items: center; padding: 10px 14px;
}
.kpi::before { content: ""; position: absolute; top: 0; left: 0; width: 22px; height: 1px; background: #47b8cf; }
.kpi-label { color: #a3b9cb; font-size: 13px; letter-spacing: .07em; }
.kpi-value { margin-top: 5px; color: #e4f4ff; font: 600 31px/1 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.055em; }
.kpi-value small { color: #8fb2c6; font: 12px var(--mono); margin-left: 7px; letter-spacing: 0; }
.kpi-note {
  align-self: end; color: #799bb0; font: 11px var(--mono); margin-bottom: 3px;
  max-width: 78px; text-align: right; line-height: 1.4;
}
.kpi.alarm .kpi-value { color: #ffc1a4; }
.kpi.alarm::before { background: var(--orange); }
.main { min-height: 0; display: grid; grid-template-columns: 282px minmax(0, 1fr) 330px; gap: 12px; }
.column { display: grid; min-height: 0; gap: 10px; }
.column-left { grid-template-rows: 300px minmax(0,1fr); }
.column-right { grid-template-rows: 350px minmax(0,1fr); }
.section-head {
  height: 45px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 0 14px; border-bottom: 1px solid var(--subline);
}
.section-head h2 { display: flex; align-items: center; gap: 8px; margin: 0; white-space: nowrap; font-size: 15px; letter-spacing: .06em; }
.section-head h2::before { content: ""; display: block; width: 3px; height: 13px; background: var(--cyan); box-shadow: 0 0 10px #22d3ee50; }
.section-meta { font: 11px var(--mono); color: var(--muted); text-align: right; white-space: nowrap; }
.zones { padding: 3px 14px 4px; }
.zone { display: grid; gap: 7px; padding: 9px 0 8px; border-bottom: 1px solid var(--subline); }
.zone:last-child { border-bottom: 0; }
.zone-text { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
.zone-text b { font: 600 16px/1 var(--mono); }
.zone-text small { font: 11px var(--mono); color: var(--muted); }
.zone-strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.zone-unit {
  height: 15px; border: 1px solid color-mix(in srgb, var(--tile) 48%, #123043);
  background: color-mix(in srgb, var(--tile) 19%, #0b1725);
  border-radius: 2px; color: #c9dae6; font: 9px/13px var(--mono); padding: 0;
}
.zone-unit:hover, .zone-unit[aria-pressed="true"] { border-color: var(--tile); background: color-mix(in srgb, var(--tile) 36%, #0b1725); color: #fff; }
.section-foot {
  padding: 9px 14px; margin: 0; color: var(--soft); font-size: 11px;
  border-top: 1px solid var(--subline);
}
.alerts { display: grid; padding: 4px 14px 0; }
.alert-row {
  display: grid; grid-template-columns: 7px 1fr auto; align-items: start; gap: 9px;
  width: 100%; padding: 13px 0; background: none; border: 0; border-bottom: 1px solid var(--subline); text-align: left;
}
.alert-row:last-child { border-bottom: 0; }
.alert-row:hover .alert-title { color: var(--cyan); }
.alert-row .dot { margin-top: 5px; color: var(--severity); }
.alert-text { min-width: 0; display: grid; gap: 5px; }
.alert-title { font-size: 13px; font-weight: 600; }
.alert-subtitle, .alert-time { color: #91a8bd; font: 11px var(--mono); }
.alert-time { margin-top: 2px; color: var(--soft); }
.alert-key { display: flex; gap: 17px; }
.alert-key span { display: inline-flex; gap: 6px; align-items: center; }
.alert-key i { width: 6px; height: 6px; border-radius: 50%; background: var(--alarm-color); }
.alert-panel { display: flex; flex-direction: column; }
.alert-panel .section-foot { margin-top: auto; }
.viewport {
  position: relative; overflow: hidden; isolation: isolate;
  border: 1px solid #2a4a61;
  background-color: #071321;
  background-image: radial-gradient(ellipse at 55% 38%, #122740 0%, #071321 69%);
}
#scene-host { position: absolute; inset: 0; }
.viewport::after {
  position: absolute; inset: 0; z-index: 7; pointer-events: none; content: "";
  background:
    linear-gradient(#5ad7ea,#5ad7ea) left top / 15px 1px,
    linear-gradient(#5ad7ea,#5ad7ea) left top / 1px 15px,
    linear-gradient(#5ad7ea,#5ad7ea) right bottom / 15px 1px,
    linear-gradient(#5ad7ea,#5ad7ea) right bottom / 1px 15px;
  background-repeat: no-repeat;
}
.viewport-top {
  position: absolute; left: 0; right: 0; top: 0; z-index: 10;
  height: 66px; padding: 12px 15px;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  background: linear-gradient(180deg,#081321 5%,#081321e6 66%,#08132100);
  pointer-events: none;
}
.scene-title { display: grid; gap: 5px; padding-left: 10px; border-left: 2px solid var(--cyan); }
.scene-title h2 { margin: 0; font-size: 17px; letter-spacing: .04em; line-height: 1; }
.scene-title span { color: #9eb8ca; font: 11px var(--mono); }
.view-control { display: flex; align-items: center; gap: 13px; pointer-events: auto; }
.current-view { font-size: 13px; color: #a7e9f5; }
.view-nav { display: flex; gap: 3px; padding: 3px; background: #08111c; border: 1px solid #284255; border-radius: 4px; }
.view-nav button {
  display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 9px;
  background: transparent; border: 1px solid transparent; border-radius: 2px; font-size: 12px; color: #a1b8ca;
}
.view-nav button[aria-pressed="true"] { background: #113748; border-color: #265d72; color: #b8f7ff; }
kbd { font: 10px var(--mono); color: #a7c4d3; text-align: center; min-width: 14px; border: 1px solid #355165; border-radius: 2px; line-height: 14px; }
.view-nav button[aria-pressed="true"] kbd { color: #9bf2ff; border-color: #48889b; }
.viewport-bottom {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 9;
  display: flex; align-items: center; justify-content: space-between; gap: 15px;
  min-height: 48px; padding: 7px 15px;
  background: #081321ed; border-top: 1px solid #243b51;
}
.scene-hint { color: #a4bed1; font-size: 12px; white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; align-items: center; justify-content: end; gap: 4px 13px; }
.legend-title { color: #7e9bb3; font-size: 11px; white-space: nowrap; }
.legend-item { display: flex; gap: 5px; align-items: center; font-size: 11px; white-space: nowrap; color: #bdcfe0; }
.legend-item i { width: 8px; height: 8px; border-radius: 2px; background: var(--swatch); box-shadow: 0 0 7px color-mix(in srgb,var(--swatch),transparent 55%); }
.legend-item em { color: #a9c4d5; font: 10px var(--mono); font-style: normal; }
.legend-item b { color: #dceff7; font: 700 11px var(--mono); }
.legend-flow { opacity: .9; }
.scene-dimmer {
  position: absolute; inset: 0; z-index: 5; pointer-events: none;
  background: #02060bee; opacity: 0; transition: opacity .65s ease;
}
.viewport[data-view="4"] .scene-dimmer, .viewport[data-view="5"] .scene-dimmer { opacity: .88; }
.rack-units {
  position: absolute; z-index: 8; right: 18px; top: 90px; width: 214px;
  background: #08131fee; border: 1px solid #2b4b62; box-shadow: 0 10px 30px #03081265;
  animation: rack-units-in .4s .48s ease-out both;
}
@keyframes rack-units-in { from { opacity: 0; transform: translateX(7px); } }
.rack-units .section-head { height: 40px; padding: 0 11px; }
.rack-units .section-head h2 { font-size: 13px; }
.rack-unit-list { list-style: none; padding: 5px 7px 7px; margin: 0; display: grid; gap: 3px; }
.rack-unit-select {
  display: grid; grid-template-columns: 52px 1fr 12px; align-items: center; gap: 6px; width: 100%; height: 34px;
  background: #0a1724; color: #c4dbea; border: 1px solid #1c3345; text-align: left; font-size: 12px;
}
.rack-unit-select .u-range { color: #99b7ca; white-space: nowrap; font: 10px var(--mono); }
.rack-unit-select .u-kind { display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.rack-unit-select .u-kind i { width: 2px; height: 11px; background: var(--kind-color); }
.rack-unit-select .u-arrow { color: #779aab; font: 12px var(--mono); }
.rack-unit-select:hover { border-color: #477487; background: #112c3c; }
.rack-unit-select[aria-pressed="true"] { border-color: #52b9ce; background: #103140; color: #e6faff; }
.rack-unit-select[aria-pressed="true"] .u-arrow { color: #a1f1ff; }
#device-host { position: absolute; inset: 66px 20px 59px; z-index: 6; }
#device-host[data-device-view="4"] { animation: device-front-in .55s cubic-bezier(.2,.6,.24,1) both; }
#device-host[data-device-view="5"] { animation: device-inside-in .55s cubic-bezier(.2,.6,.24,1) both; }
@keyframes device-front-in { from { opacity: 0; transform: translateY(10px) scale(.985); } }
@keyframes device-inside-in { from { opacity: 0; transform: translateY(10px) scale(.985); } }
.detail { padding: 11px 14px 13px; }
.rack-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.rack-heading strong { display: block; font: 700 31px/1 var(--mono); letter-spacing: -.05em; }
.rack-heading small { display: block; color: var(--muted); font-size: 11px; margin-top: 6px; }
.rack-state { color: var(--status); display: flex; align-items: center; gap: 6px; font-size: 12px; border: 1px solid color-mix(in srgb,var(--status) 38%,#172a40); border-radius: 3px; padding: 4px 8px; }
.rack-metrics { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 7px; }
.rack-metric { padding: 6px 9px 7px; min-width: 0; min-height: 48px; background: #07101a; border: 1px solid #192e42; display: grid; gap: 3px; }
.rack-metric small { color: var(--muted); font-size: 11px; }
.rack-metric b { font: 600 17px/1 var(--mono); color: var(--metric-color,#ddecf9); }
.rack-metric em { font: 11px var(--mono); font-style: normal; color: #9cb7cb; margin-left: 4px; }
.rack-workload { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12px; padding: 11px 0 9px; }
.rack-workload b { color: #d4e4ef; font-weight: 500; }
.detail-action {
  width: 100%; height: 29px; display: flex; justify-content: space-between; align-items: center;
  padding: 0 9px; background: #0d2330; border: 1px solid #224d61; color: #9de6f3; border-radius: 3px; font-size: 12px;
}
.detail-action:hover { background: #15394b; color: #defaff; }
.power-body { padding: 0 14px; }
.power-source { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 10px; }
.power-source b { font-size: 13px; }
.power-source span { color: var(--muted); font: 11px var(--mono); }
.power-path { display: grid; grid-template-columns: 1fr 1fr; min-height: 100px; position: relative; gap: 10px; padding-top: 13px; }
.power-path::before { content: ""; position: absolute; top: 0; height: 14px; left: 24%; right: 24%; border: 1px solid #305672; border-bottom: 0; }
.power-path::after { content: ""; position: absolute; top: -4px; left: calc(50% - 3px); width: 6px; height: 6px; border-radius: 50%; background: #88d2ed; box-shadow: 0 0 8px #22d3ee65; }
.feed { background: #07101b; border: 1px solid #203c53; padding: 8px 9px; display: grid; gap: 5px; color: var(--feed); }
.feed span { display: flex; justify-content: space-between; align-items: center; font: 12px var(--mono); }
.feed span small { color: #9db7cb; font-size: 10px; }
.feed strong { font: 600 19px/1 var(--mono); }
.feed strong small { font: 11px var(--mono); margin-left: 4px; color: var(--muted); }
.feed p { margin: 0; color: var(--muted); font: 11px var(--mono); }
.feed-meter { height: 3px; background: #1b2d3b; }
.feed-meter i { height: 100%; display: block; width: var(--feed-share); background: var(--feed); }
.power-total { display: flex; align-items: center; justify-content: space-between; padding: 13px 0 10px; border-bottom: 1px solid var(--subline); color: var(--muted); font-size: 12px; }
.power-total b, .power-rack b { color: var(--text); font: 600 13px var(--mono); }
.power-rack { display: grid; gap: 6px; padding: 12px 0 9px; }
.power-rack p { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0; font-size: 12px; color: var(--muted); }
.charts { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
.chart-panel { display: grid; grid-template-rows: 40px minmax(0,1fr); }
.chart-panel .section-head { height: 40px; }
.chart-panel .section-meta { color: #9fbfd5; }
.statusbar { display: flex; justify-content: space-between; align-items: center; padding: 0 2px 7px; color: #7e9ab0; font: 11px var(--mono); }
.statusbar span:first-child { letter-spacing: .08em; }
.statusbar .dot { color: var(--cyan); width: 5px; height: 5px; margin-right: 5px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
@media(prefers-reduced-motion: reduce) {
  .scene-dimmer { transition-duration: .01ms; }
  #device-host[data-device-view] { animation-duration: .01ms; }
  .rack-units { animation: none; }
}
/* SCENE_CSS */
#scene-host {
  overflow: hidden;
  isolation: isolate;
  background: radial-gradient(ellipse at 48% 51%, #152e34 0%, #0a1a20 46%, #061217 76%);
}
.dc-room-perspective {
  position: absolute;
  top: 50%; left: 50%;
  width: 0; height: 0;
  perspective: 965px;
  perspective-origin: 0 0;
}
.dc-room-world, .dc-room-rack, .dc-room-fixture {
  position: absolute;
  width: 0; height: 0;
  transform-origin: 0 0 0;
  transform-style: preserve-3d;
}
.dc-room-plane {
  position: absolute;
  left: 0; top: 0;
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border: 0;
  color: #c2d6d7;
  font: 600 10px/1 'IBM Plex Mono', Consolas, monospace;
  line-height: 1;
  text-align: left;
  backface-visibility: hidden;
  pointer-events: none;
}
.dc-room-floor {
  background:
    linear-gradient(90deg, #518a8a1b 1px, transparent 1px) center/41px 41px,
    linear-gradient(0deg, #518a8a1a 1px, transparent 1px) center/41px 41px,
    radial-gradient(ellipse at 50% 25%, #183137, #10262d 51%, #0b1d25 100%);
  box-shadow: inset 0 0 0 1px #46646d, 0 0 35px #000b;
}
.dc-room-wall {
  background:
    linear-gradient(0deg, #65adb51c 1px, transparent 1px) 0 0/100% 38px,
    linear-gradient(90deg, #6095a019 1px, transparent 1px) 0 0/49px 100%,
    linear-gradient(0deg, #132a30 0%, #0d2027 95%, #2f5159 100%);
  box-shadow: inset 0 0 0 1px #41626a, inset 0 -7px #0a1a20;
}
.dc-room-wall::before {
  position: absolute;
  top: 26px; left: 0; right: 0;
  content: '';
  border-top: 1px solid #81aeb362;
  border-bottom: 3px solid #06262b;
}
.dc-room-wall-text {
  position: absolute;
  top: 13px; left: 18px;
  letter-spacing: .28em;
  font-size: 10px;
  color: #8aacae;
}
.dc-room-plinth {
  background: repeating-linear-gradient(90deg, #4d7a8029 0 1px, transparent 1px 41px), linear-gradient(#30474e, #0c1d24 60%, #101f27);
  border-top: 1px solid #8cb6bf61;
  border-bottom: 1px solid #3b606b;
}
.dc-room-plinth::after {
  content: '';
  position: absolute;
  inset: auto 0 4px;
  border-top: 1px solid #53d4c858;
}
.dc-room-entry {
  background: linear-gradient(90deg, #132428 2%, #28434a 4%, #24393e 7%, #14262d 47%, #08161d 49%, #122b31 51%, #223d44 96%, #101f26 99%);
  border: 2px solid #61767b;
  border-bottom: 0;
  box-shadow: 0 0 10px #0008, inset 0 0 9px #031015;
}
.dc-room-entry::before, .dc-room-entry::after {
  content: '';
  position: absolute;
  top: 24px; left: 14px;
  width: 15px; height: 47px;
  background: linear-gradient(120deg, #5fa2a740, transparent 40%), #0e2127;
  box-shadow: 0 0 0 1px #547880;
}
.dc-room-entry::after { left: auto; right: 14px; }
.dc-room-exit {
  display: grid;
  place-items: center;
  font-family: 'Microsoft YaHei', sans-serif;
  font-size: 8px;
  letter-spacing: .12em;
  border: 1px solid #83ffe7b8;
  background: #285e58;
  box-shadow: 0 0 9px #51d0c065;
  color: #d6fff3;
}
.dc-room-rack { --signal: #63ded0; }
.dc-room-rack-face {
  pointer-events: auto;
  cursor: pointer;
  border: 1px solid #527179;
  background-color: #1a2930;

.dc-room-rack-face::before, .dc-room-rack-face::after {

.dc-room-rack-lid {

.dc-room-rack-lid::before {

.dc-room-top-code {

.dc-room-rack-lid::after { inset: auto 3px 3px; height: 2px; background: var(--signal); opacity: .85; }
.dc-room-rack-side {

.dc-room-rack-side::after {

}
.dc-room-rack-bottom { background: #102025; }
.dc-room-rack-door {

  transition: transform 840ms cubic-bezier(.2,.76,.17,1), background 240ms;
  backface-visibility: visible;
  background:
    linear-gradient(90deg, #1d3339 0 7%, transparent 7% 93%, #1c3037 93%),
    linear-gradient(0deg, #121f25 0 5%, #0000 5% 90%, #243940 90%),
    radial-gradient(circle, #65808663 .46px, transparent .75px) 0 0/2.7px 2.7px,

.dc-room-rack-door::before {

}

.dc-room-rack-code {

}

.dc-room-active .dc-room-rack-face, .dc-room-rack-face:hover, .dc-room-rack-face:focus-visible {

}
.dc-room-open .dc-room-rack-door {

    linear-gradient(90deg, #22373e 0 7%, #0000 7% 93%, #22373e 93%),
    radial-gradient(circle, #001218bc .6px, #5376814a .85px, transparent 1.2px) 0 0/2.7px 2.7px,

.dc-room-interior {

.dc-room-open .dc-room-interior { display: block; }
.dc-room-interior-code {

}
.dc-room-u-tick {

}
.dc-room-unit {
  appearance: none;
  position: absolute;
  left: 25px;
  width: calc(100% - 70px);

}
.dc-room-unit span {
  flex: 1;
  height: calc(100% - 5px);

    radial-gradient(circle, #0f1f24 1px, transparent 1.6px) 0 0/4px 4px,

}
.dc-room-unit.dc-room-ports { background: #314449; }

.dc-room-unit.dc-room-disks { background: #2c4149; }

.dc-room-unit b {

.dc-room-net {

.dc-room-under-rack { background: radial-gradient(ellipse, #020b10 8%, #041218b0 46%, transparent 74%); }
.dc-room-tape {

.dc-room-tape::before {
  content: '⌃\A⌃\A⌃\A⌃\A⌃\A⌃';

.dc-room-lane-mark {

  border: 1px solid #50716e;

  letter-spacing: .12em;
  font: 700 8px/1 Consolas,'Microsoft YaHei',sans-serif;
}
.dc-room-bridge {
  backface-visibility: visible;
  background:
    repeating-linear-gradient(0deg,#819b9b80 0 1px,#0000 1px 18px),
    linear-gradient(90deg,#1e373d 0 3px, #4872786b 3px 4px, #0000 4px calc(100% - 4px), #4872786b calc(100% - 4px) calc(100% - 3px), #1e373d calc(100% - 3px));
  border-inline: 1px solid #7eb0b37a;

.dc-room-rack-bridge {
  border-color: #77959840;
  background:
    repeating-linear-gradient(0deg, #749ca24b 0 1px, #0000 1px 16px),

}
.dc-room-bus {
  backface-visibility: visible;
  background: #68b9ac83;
  box-shadow: 0 0 5px #38e0ba27;
}
.dc-room-lamp {
  backface-visibility: visible;
  background: #8ad6d3;
  border: 1px solid #b0ece8;
  box-shadow: 0 0 9px 1px #65bfbc83, 0 0 26px 3px #4bacae33;
}
.dc-room-fixture > .dc-room-plane {
  background: linear-gradient(110deg, #3b555b, #22383e 50%, #1b313a);
  border: 1px solid #607981;
}
.dc-room-fixture > .dc-room-ac-front {
  background:
    repeating-linear-gradient(0deg, #111e23 0 2px, #2b4349 2px 3px) center bottom 8px/84% 55% no-repeat,
    linear-gradient(90deg,#233941,#587176 7%,#354e57 16%,#304950 79%,#253e45 92%,#182d34);

.dc-room-fixture > .dc-room-pdu-front::after {
  content: 'ϟ';
  position: absolute;

  color: #ffc971;
  font: 700 25px/1 Consolas,monospace;
}
.dc-room-fixture-label {
  position: absolute;
  top: 10px; left: 4px; right: 4px;
  padding-bottom: 5px;
  border-bottom: 1px solid #9bc9c761;

.dc-room-effects {

  width: 100%; height: 100%;
  pointer-events: none;

@media (prefers-reduced-motion: reduce) {
  .dc-room-rack-door { transition-duration: 1ms; }
}

.dcp-front-callouts span, .dcp-open-specs { color: #9dadbb; font: clamp(8px, 1.16cqi, 11px)/1.2 var(--dcp-mono); }

.dcp-open-figure { gap: 14px; }
.dcp-air-track { display: flex; align-items: center; gap: 12px; min-width: 445px; margin: 0 4%; }
.dcp-air-track strong { color: #7bdded; font-size: 10px; font-weight: 560; white-space: nowrap; }
.dcp-air-track strong:last-child { color: #ffc18c; }
.dcp-air-track b { margin-left: 2px; font: 600 11px/1 var(--dcp-mono); }
.dcp-air-track i { position: relative; flex: 1; height: 1px; border-radius: 10px; background: linear-gradient(90deg, #45cce8, #4dc7d766 50%, #da9168); }
.dcp-air-track i::after { content: ""; position: absolute; right: 0; top: -3px; width: 7px; height: 7px; border: 1px solid #da9168; border-left: 0; border-bottom: 0; transform: rotate(45deg); }
.dcp-open-layout { --dcp-comp-cols: 20% 10% minmax(0, 1fr) 17%; min-width: 445px; margin: 0 4%; }
.dcp-open-hardware, .dcp-open-labels, .dcp-open-specs { display: grid; grid-template-columns: var(--dcp-comp-cols); gap: 7px; text-align: center; }
.dcp-open-labels { align-items: end; padding: 0 7px 6px; color: #c0deea; }
.dcp-open-labels span { position: relative; }
.dcp-open-labels span::after { position: absolute; content: ""; height: 4px; left: 50%; top: 100%; margin-top: 2px; border-left: 1px solid #427e8c; }
.dcp-open-labels span:last-child::after { border-color: #bd856a; }
.dcp-open-hardware {
  position: relative;
  height: clamp(100px, 20cqi, 220px);
  max-height: 26vh;
  min-height: 104px;
  padding: 7px;
  border: 1px solid #64808c;
  border-radius: 3px;
  background: linear-gradient(180deg, #3a5260 0, #0c1b24 5%, #142d36 92%, #344a58 99%);
  box-shadow: inset 0 0 0 2px #5d7d8855, 0 12px 19px #0009;
}
.dcp-open-hardware::after { content: ""; position: absolute; inset: 3px; border: 1px solid #284251; pointer-events: none; }
.dcp-open-specs { align-items: start; padding: 7px 7px 0; }
.dcp-open-front {
  display: grid;
  grid-auto-flow: column;
  grid-template-rows: repeat(4, minmax(0, 1fr));
  gap: 4px 3px;
  padding: 4px 7px 4px 3px;
  border: 1px solid #304657;
  border-right: 3px solid #497384;
  border-radius: 2px;
  background: #102430;
}
.dcp-open-drive {
  position: relative;
  display: flex;
  align-items: end;
  justify-content: end;
  padding: 2px;
  overflow: hidden;
  color: #b3c9d5;
  border: 1px solid #567380;
  border-radius: 2px;
  background: linear-gradient(#506775, #2f4751 14%, #1f3744 73%, #3e5363);
}
.dcp-open-drive::before { position: absolute; content: ""; inset: 2px 30% 2px 2px; background: repeating-linear-gradient(90deg, #233742 0 2px, #5d7683 2px 3px); }
.dcp-open-drive b { position: relative; font: 8px/1 var(--dcp-mono); }
.dcp-open-drive i { position: absolute; width: 3px; height: 3px; top: 3px; right: 3px; border-radius: 50%; background: #68edbf; box-shadow: 0 0 5px #68edbf66; }
.dcp-fan-wall { display: flex; flex-direction: column; gap: 2px; min-height: 0; padding: 3px; border: 1px solid #466977; border-radius: 2px; background: #0c212c; }
.dcp-fan { position: relative; display: grid; place-items: center; flex: 1; min-height: 0; overflow: hidden; border: 1px solid #233e52; border-radius: 2px; background: linear-gradient(90deg, #263e49, #0c1721 45% 55%, #294250); }
.dcp-fan i {
  width: auto;
  height: min(90%, 29px);
  aspect-ratio: 1;
  border: 1px solid #4d8192;
  border-radius: 50%;
  background:
    radial-gradient(circle, #112630 0 14%, #66a5b1 15% 20%, transparent 21%),
    repeating-conic-gradient(from 45deg, #183243 0 20deg, #5c8996 22deg 37deg, #30536a 41deg 58deg);
  box-shadow: inset 0 0 9px #040c15;
}
.dcp-fan span { position: absolute; top: 2px; right: 2px; color: #85b1bf; font: 7px/1 var(--dcp-mono); }
.dcp-board {
  position: relative;
  display: grid;
  justify-items: center;
  grid-template-rows: 1fr 1fr auto;
  gap: 4px;
  padding: 6px 4%;
  min-height: 0;
  overflow: hidden;
  border: 1px solid #386774;
  border-radius: 2px;
  background: radial-gradient(ellipse at center, #17505a 0%, #153945 50%, #102731 100%);
}
.dcp-board-traces { position: absolute; inset: 8% 3%; pointer-events: none; }
.dcp-board-traces::before, .dcp-board-traces::after {
  position: absolute;
  content: "";
  width: 100%;
  height: 40%;
  left: 0;
  transform: skewX(-35deg);
  background:
    repeating-linear-gradient(0deg, transparent 0 4px, #54929a3b 4px 5px, transparent 5px 8px),
    repeating-linear-gradient(90deg, transparent 0 18px, #6eacad32 18px 19px, transparent 20px 27px);
  border-top: 1px solid #7dc3c445;
  border-bottom: 1px solid #7dc3c445;
}
.dcp-board-traces::before { top: 5%; }
.dcp-board-traces::after { bottom: 13%; transform: skewX(35deg); }
.dcp-chip-row { z-index: 1; display: grid; grid-template-columns: 1fr 1.6fr 1fr; gap: 5%; width: min(85%, 330px); min-height: 0; }
.dcp-chip {
  position: relative;
  display: grid;
  place-items: center;
  min-height: 0;
  border: 1px solid #6aa9b7;
  background: repeating-linear-gradient(90deg, #748b81 0 1px, #223d49 1px 4px);
  box-shadow: 0 0 0 2px #0d2531, 0 0 12px #53d1dd49;
}
.dcp-chip::before {
  position: absolute;
  content: "";
  inset: 4px;
  border: 1px solid #9edae5;
  background: radial-gradient(ellipse at center, #3c8b94 1%, #2b5963 51%, #254751 100%);
  box-shadow: inset 0 0 10px #5bfcf952;
}
.dcp-chip span { z-index: 1; color: #e2fcff; font: bold clamp(8px, 1.5cqi, 15px)/1 var(--dcp-mono); text-shadow: 0 0 6px #83e0e7; white-space: nowrap; }
.dcp-dimms { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; padding-block: 1px; }
.dcp-dimms i { border: 1px solid #507e84; border-left: 1px solid #99b592; border-radius: 1px; background: repeating-linear-gradient(180deg, #081c23 0 5px, #39645d 5px 6px, #1c3d46 6px 8px); }
.dcp-board-connectors { display: flex; gap: 8px; }
.dcp-board-connectors i { width: clamp(10px, 3cqi, 40px); height: 4px; border: 1px solid #5f798a; background: repeating-linear-gradient(90deg, #263947 0 1px, #6a8790 1px 2px); }
.dcp-psu-bank { display: grid; grid-template-rows: 1fr 1fr; gap: 4px; padding: 3px; border: 1px solid #63818a; border-radius: 2px; background: #252f39; }
.dcp-psu {
  position: relative;
  display: grid;
  place-items: center;
  min-height: 0;
  overflow: hidden;
  border: 1px solid #646c75;
  border-radius: 2px;
  background: radial-gradient(circle, #131c24 1px, #576875 1.35px, #33444e 1.8px) 0 0 / 4px 4px;
}
.dcp-psu i { position: absolute; top: 5px; right: 4px; width: 3px; height: 3px; border-radius: 50%; background: #7ff1b7; box-shadow: 0 0 6px #7ff1b7; }
.dcp-psu b { padding: 3px 4px; border: 1px solid #5c707d; border-radius: 2px; background: #24323c; color: #cfdee5; font: 9px/1 var(--dcp-mono); }

.dcp-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(5px, 1cqi, 12px); }
.dcp-metric { position: relative; display: grid; gap: 4px; min-width: 0; padding: 8px clamp(6px, 1.3cqi, 13px); border: 1px solid #263948; border-radius: 4px; background: #0e1a25; }
.dcp-metric span { color: var(--dcp-muted); font-size: 11px; white-space: nowrap; }
.dcp-metric strong { font: 600 clamp(15px, 2.6cqi, 26px)/1 var(--dcp-mono); color: #c4d8e9; white-space: nowrap; }
.dcp-metric small { margin-left: 4px; color: #91aabc; font-size: .54em; font-weight: 500; }
.dcp-cool strong { color: #7ae4f2; }
.dcp-warm strong { color: #ffc18c; }
.dcp-power strong { color: #b6a9fc; }

@container (max-width: 510px) {
  .dcp-view-icon { display: none; }
  .dcp-views button { padding-inline: 6px; }
  .dcp-air-track { margin-inline: 14px; }
  .dcp-open-layout { margin-inline: 14px; }
}

@media (max-height: 780px) {
  .dcp-panel { gap: 11px; padding-block: 13px; }
  .dcp-open-figure { gap: 9px; }
  .dcp-open-hardware { max-height: 24vh; }
}
/* END_DEVICE_CSS */
/* CHARTS_CSS */
.chart-host {
  position: relative;
  width: 100%;
  min-width: 0;
  min-height: 0;
  isolation: isolate;
}

.chart-surface {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: pan-y;
}

.chart-surface:focus-visible {
  outline: 1px solid #22d3ee;
  outline-offset: -3px;
}

.chart-tooltip {
  position: absolute;
  z-index: 1;
  top: 0;
  left: 0;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 6px 9px;
  border: 1px solid #2a4156;
  border-radius: 3px;
  background: #0c1825;
  box-shadow: 0 5px 16px #02060b99;
  color: #9eacc0;
  font: 11px/15px Consolas, "Microsoft YaHei UI", monospace;
  white-space: nowrap;
  pointer-events: none;
}

.chart-tooltip strong {
  color: #e5f4ff;
  font-weight: 600;
}

.chart-tooltip[hidden] {
  display: none;
}
/* END_CHARTS_CSS */
</style>
</head>

<script>
'use strict';
/* SCENE_JS */
function createRoom(host, { onRack, onDevice }) {
  const rackSize = { width: 68, depth: 76, height: 172 };
  const rowCenters = [-246, -82, 82, 246];
  const aisleCenters = [-164, 164];
  const roomWidth = 744;
  const roomLength = 666;
  const roomHeight = 238;
  const wallZ = -roomLength / 2;
  const trayY = -204;
  const perspectiveDistance = 965;
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const perspective = document.createElement('div');
  const world = document.createElement('div');
  const effects = document.createElement('canvas');
  const context = effects.getContext('2d');
  effects.setAttribute('aria-hidden', 'true');
  perspective.className = 'dc-room-perspective';
  world.className = 'dc-room-world';
  effects.className = 'dc-room-effects';
  perspective.append(world);
  host.append(perspective, effects);

  function plane(parent, className, width, height, x, y, z, rotation = '', tag = 'div') {
    const element = document.createElement(tag);
    element.className = `dc-room-plane ${className}`;
    element.style.width = `${width}px`;
    element.style.height = `${height}px`;
    element.style.transform = `translate3d(${x - width / 2}px,${y - height / 2}px,${z}px) ${rotation}`;
    if (tag === 'button') element.type = 'button';
    parent.append(element);
    return element;
  }

  function label(parent, className, value) {
    const element = document.createElement('span');
    element.className = className;
    element.textContent = value;
    parent.append(element);
    return element;
  }

  function floorPlane(className, width, length, x, y, z) {
    return plane(world, className, width, length, x, y, z, 'rotateX(90deg)');
  }

  floorPlane('dc-room-floor', roomWidth, roomLength, 0, 0, 0);
  plane(world, 'dc-room-plinth', roomWidth, 14, 0, 7, roomLength / 2);
  plane(world, 'dc-room-plinth', roomLength, 14, roomWidth / 2, 7, 0, 'rotateY(90deg)');
  const backWall = plane(world, 'dc-room-wall', roomWidth, roomHeight, 0, -roomHeight / 2, wallZ);
  label(backWall, 'dc-room-wall-text', 'DATA HALL · A');
  plane(world, 'dc-room-wall', roomLength, roomHeight, -roomWidth / 2, -roomHeight / 2, 0, 'rotateY(90deg)');
  plane(world, 'dc-room-entry', 67, 134, -164, -67, wallZ + 2);
  plane(world, 'dc-room-exit', 39, 10, -164, -145, wallZ + 3).textContent = '安全出口';

  for (const [index, x] of aisleCenters.entries()) {
    floorPlane('dc-room-tape', 76, 571, x, -.15, 0);
    floorPlane('dc-room-lane-mark', 76, 21, x, -.2, 298).textContent = `冷通道 ${index + 1}`;
    floorPlane('dc-room-bridge', 26, roomLength - 59, x, trayY, -13);
    floorPlane('dc-room-bus', 1.6, roomLength - 59, x - 9, trayY - .25, -13);
    floorPlane('dc-room-bus', 1.6, roomLength - 59, x + 9, trayY - .25, -13);
    for (const z of [-238, -80, 78, 236]) {
      floorPlane('dc-room-lamp', 2.6, 48, x - 17, trayY + 1, z);
      floorPlane('dc-room-lamp', 2.6, 48, x + 17, trayY + 1, z);
    }
  }
  for (const z of [-305, 274]) {
    plane(world, 'dc-room-bridge', 18, 611, 0, trayY, z, 'rotateX(90deg) rotate(90deg)');
  }
  for (const x of rowCenters) {
    floorPlane('dc-room-bridge dc-room-rack-bridge', 14, roomLength - 67, x, trayY + .5, -15);
  }

  function fixture(x, z, type, name) {
    const element = document.createElement('div');
    const width = type === 'ac' ? 49 : 39;
    const height = type === 'ac' ? 142 : 119;
    const depth = 26;
    element.className = 'dc-room-fixture';
    element.style.transform = `translate3d(${x}px,${-height / 2}px,${z}px)`;
    const front = plane(element, `dc-room-${type}-front`, width, height, 0, 0, depth / 2);
    label(front, 'dc-room-fixture-label', name);
    plane(element, '', depth, height, width / 2, 0, 0, 'rotateY(90deg)');
    plane(element, '', depth, height, -width / 2, 0, 0, 'rotateY(-90deg)');
    plane(element, '', width, depth, 0, -height / 2, 0, 'rotateX(90deg)');
    world.append(element);
  }

  fixture(-314, -307, 'ac', 'CRAC-01');
  fixture(310, -307, 'ac', 'CRAC-02');
  fixture(-40, -307, 'pdu', 'PDU-01');
  fixture(43, -307, 'pdu', 'PDU-02');

  let cabinets = [];
  let state = { view: 1, rack: 0, device: 0, mode: 'temp' };
  let width = 0;
  let height = 0;
  let ratio = 1;
  let projection;
  let camera;
  let transition;
  let detailView;

  const detailScale = 3;
  const detailWidth = rackSize.width - 1.5;
  const detailHeight = rackSize.height - 1.5;
  const layoutWidth = detailWidth * detailScale;
  const layoutHeight = detailHeight * detailScale;
  const rulerTop = 22;
  const unitHeight = (layoutHeight - rulerTop - 18) / 42;
  const unitClass = { switch: 'ports', storage: 'disks', blade: 'blades', server: 'servers' };
  const wireColors = ['#81d6bb', '#eca65b', '#65cbbb', '#6ca2d7'];

  function fillInterior(cabinet) {
    const { inside, record } = cabinet;
    if (cabinet.devices === record.devices) return;
    cabinet.devices = record.devices;
    inside.replaceChildren();
    label(inside, 'dc-room-interior-code', `${record.id} · 42U`);
    cabinet.buttons = [];
    for (let u = 42; u >= 1; u -= 1) {
      const graduation = label(inside, 'dc-room-u-tick', String(u).padStart(2, '0'));
      graduation.style.top = `${rulerTop + (42.5 - u) * unitHeight}px`;
    }
    const wiring = document.createElement('canvas');
    wiring.className = 'dc-room-net';
    wiring.width = Math.round(layoutWidth - 10);
    wiring.height = Math.round(layoutHeight - 10);
    wiring.setAttribute('aria-hidden', 'true');
    const wires = wiring.getContext('2d');
    wires.lineWidth = 1.65;
    record.devices.forEach((device, index) => {
      const element = document.createElement('button');
      const top = rulerTop + (43 - Number(device.start) - Number(device.units)) * unitHeight;
      const size = Number(device.units) * unitHeight;
      const kind = unitClass[device.type] || unitClass.server;
      const endX = wiring.width - 8 - index * 2.15;
      const endY = top + size / 2;
      element.type = 'button';
      element.className = `dc-room-unit dc-room-${kind}`;
      element.style.top = `${top}px`;
      element.style.height = `${size}px`;
      element.title = `${device.name} · U${device.start} · ${device.units}U`;
      element.setAttribute('aria-label', element.title);
      element.addEventListener('click', () => onDevice(index));
      const slots = { ports: 8, disks: 6, blades: 6, servers: 4 };
      for (let i = 0; i < slots[kind]; i += 1) element.append(document.createElement('span'));
      element.append(document.createElement('b'));
      inside.append(element);
      cabinet.buttons.push(element);
      wires.strokeStyle = wireColors[index % wireColors.length];
      wires.beginPath();
      wires.moveTo(wiring.width - 43, endY);
      wires.bezierCurveTo(wiring.width - 29, endY + 7, endX, endY + 3, endX, endY - 13);
      wires.lineTo(endX, 7.2);
      wires.stroke();
    });
    inside.append(wiring);
  }

  function cabinetAt(record, index) {
    const r = document.createElement('div');
    const { width, depth, height } = rackSize;
    const facing = record.row % 2 === 0 ? 1 : -1;
    const x = rowCenters[record.row];
    const z = (2.5 - record.col) * 98;
    r.className = 'dc-room-rack';
    r.style.transform = `translate3d(${x}px,${-height / 2}px,${z}px) rotateY(${facing * 90}deg)`;
    r.style.setProperty('--door-z', `${depth / 2}px`);
    r.style.setProperty('--top-direction', facing < 0 ? '180deg' : '0deg');

    floorPlane('dc-room-under-rack', 119, 93, x, -.1, z);
    const lid = plane(r, 'dc-room-rack-face dc-room-rack-lid', width, depth, 0, -height / 2, 0, 'rotateX(90deg)', 'button');
    const topCode = label(lid, 'dc-room-top-code', record.id);
    const amp = label(topCode, 'dc-room-amp', '');
    const left = plane(r, 'dc-room-rack-face dc-room-rack-side', depth, height, -width / 2, 0, 0, 'rotateY(-90deg)', 'button');
    const right = plane(r, 'dc-room-rack-face dc-room-rack-side', depth, height, width / 2, 0, 0, 'rotateY(90deg)', 'button');
    const bottom = plane(r, 'dc-room-rack-face dc-room-rack-bottom', width, depth, 0, height / 2, 0, 'rotateX(-90deg)');
    const inside = plane(r, 'dc-room-interior', layoutWidth, layoutHeight, 0, 0, depth / 2 - 2, `scale(${1 / detailScale})`);
    const door = plane(r, 'dc-room-rack-face dc-room-rack-door', width, height, 0, 0, depth / 2, '', 'button');
    door.style.removeProperty('transform');
    label(door, 'dc-room-rack-code', record.id);
    const faces = [lid, left, right, bottom, door];
    for (const face of [lid, left, right, door]) {
      face.setAttribute('aria-label', `机柜 ${record.id}`);
      face.title = `查看机柜 ${record.id}`;
      face.tabIndex = face === lid ? 0 : -1;
      face.addEventListener('click', () => onRack(index));
    }
    world.append(r);
    const bounds = [
      [x - depth / 2, x + depth / 2],
      [-height, 0],
      [z - width / 2, z + width / 2]
    ];
    return { record, element: r, inside, faces, amp, x, z, facing, bounds };
  }

  const overview = { eye: [620, -685, 960], target: [0, -38, 0], focal: 965 };

  function viewpoint(state) {
    const cabinet = cabinets[state.rack];
    if (state.view === 1 || !cabinet) return overview;
    const { x, z, facing, record } = cabinet;
    if (state.view === 2) {
      const center = aisleCenters[Math.floor(record.row / 2)];
      return { eye: [center, -108, 484], target: [center, -83, -212], focal: 520 };
    }
    return {
      eye: [x + facing * 112, -97, z - facing * 16],
      target: [x + facing * 30, -100, z + facing * 6],
      focal: 207
    };
  }

  const subtract = (a, b) => a.map((value, i) => value - b[i]);
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const normalize = vector => {
    const length = Math.hypot(...vector);
    return vector.map(value => value / length);
  };

  function setCamera(camera) {
    const scale = Math.min(width / 1224, height / 660);
    const focal = Math.max(1, camera.focal * scale);
    // Adjust the camera depth with the focal length while keeping CSS perspective fixed.
    const depthScale = perspectiveDistance / focal;
    const toward = normalize(subtract(camera.eye, camera.target));
    const right = normalize(cross([0, 1, 0], toward));
    const down = cross(toward, right);
    const negativeEye = camera.eye.map(value => -value);
    world.style.transform = `matrix3d(${[
      right[0], down[0], toward[0] * depthScale, 0,
      right[1], down[1], toward[1] * depthScale, 0,
      right[2], down[2], toward[2] * depthScale, 0,
      dot(right, negativeEye), dot(down, negativeEye), perspectiveDistance + dot(toward, negativeEye) * depthScale, 1
    ].map(value => value.toFixed(8)).join(',')})`;
    projection = { eye: camera.eye, right, down, toward, focal };
  }

  function point(x, y, z) {
    const offset = [x - projection.eye[0], y - projection.eye[1], z - projection.eye[2]];
    const depth = -dot(projection.toward, offset);
    if (depth < 5) return null;
    const scale = projection.focal / depth;
    return { x: width / 2 + dot(projection.right, offset) * scale, y: height / 2 + dot(projection.down, offset) * scale, scale };
  }

  function occluded(x, y, z) {
    const eye = projection.eye;
    const slope = [x - eye[0], y - eye[1], z - eye[2]];
    for (const { bounds } of cabinets) {
      let enter = 0;
      let exit = .998;
      for (let axis = 0; axis < 3 && enter <= exit; axis += 1) {
        const [min, max] = bounds[axis];
        if (Math.abs(slope[axis]) < .0001) {
          if (eye[axis] < min || eye[axis] > max) enter = Infinity;
          continue;
        }
        const from = (min - eye[axis]) / slope[axis];
        const to = (max - eye[axis]) / slope[axis];
        enter = Math.max(enter, Math.min(from, to));
        exit = Math.min(exit, Math.max(from, to));
      }
      if (enter <= exit) return true;
    }
    return false;
  }

  function sizeCanvas() {
    width = host.clientWidth;
    height = host.clientHeight;
    ratio = Math.min(devicePixelRatio || 1, 2);
    effects.width = Math.round(width * ratio);
    effects.height = Math.round(height * ratio);
    context.setTransform(ratio, 0, 0, ratio, 0, 0);
    if (camera) setCamera(camera);
  }

  function floorFlow(seconds) {
    const emphasis = state.mode === 'flow';
    for (const [lane, x] of aisleCenters.entries()) {
      for (let i = 0; i < (emphasis ? 52 : 13); i += 1) {
        const length = emphasis ? 579 : 555;
        const drift = (i * 73.71 + lane * 61 + seconds * (emphasis ? 68 : 35)) % length;
        const z = (emphasis ? 294 : 270) - drift;
        const laneX = x + ((i * 13) % 61) - 30;
        const lead = point(laneX, -1, z);
        const tail = point(laneX, -1, z + (emphasis ? 10 : 3) + i % 5);
        if (!lead || !tail || occluded(laneX, -1, z) || lead.x < 0 || lead.x > width || lead.y < 0 || lead.y > height) continue;
        const alpha = (emphasis ? .57 : .2) + .16 * Math.sin(drift / length * Math.PI);
        context.strokeStyle = `rgba(102,249,208,${alpha})`;
        context.lineWidth = Math.max(.6, lead.scale * (emphasis ? 2 : 1.2));
        context.beginPath();
        context.moveTo(tail.x, tail.y);
        context.lineTo(lead.x, lead.y);
        context.stroke();
        context.fillStyle = `rgba(175,255,222,${alpha + .13})`;
        const size = Math.max(.8, lead.scale * (emphasis ? 2.8 : 1.5));
        context.fillRect(lead.x, lead.y, size, size);
      }
    }
  }

  function spot(position, radius) {
    if (!position) return;
    const light = context.createRadialGradient(position.x, position.y, 1, position.x, position.y, radius);
    light.addColorStop(0, '#84f7dc8a');
    light.addColorStop(.13, '#62e9ca42');
    light.addColorStop(1, '#50d8b700');
    context.fillStyle = light;
    context.fillRect(position.x - radius, position.y - radius, radius * 2, radius * 2);
  }

  function connections(seconds) {
    const active = cabinets[state.rack];
    if (!active) return;
    const anchor = point(active.x, -rackSize.height - 6, active.z);
    if (!anchor) return;
    const intensity = state.mode === 'flow' ? 1 : .65;
    const rise = 30 * anchor.scale;
    const gradient = context.createLinearGradient(anchor.x, anchor.y, anchor.x, anchor.y - rise);
    gradient.addColorStop(0, '#87ffe096');
    gradient.addColorStop(1, '#87ffe000');
    context.fillStyle = gradient;
    context.beginPath();
    context.moveTo(anchor.x - 5 * anchor.scale, anchor.y);
    context.lineTo(anchor.x - 1, anchor.y - rise);
    context.lineTo(anchor.x + 1, anchor.y - rise);
    context.lineTo(anchor.x + 5 * anchor.scale, anchor.y);
    context.fill();
    context.lineWidth = .8;
    const phase = (seconds / 2.6) % 1;
    context.strokeStyle = `rgba(121,244,209,${(1 - phase) * .65})`;
    context.beginPath();
    context.ellipse(anchor.x, anchor.y, 3 + phase * 23 * anchor.scale, 2 + phase * 10 * anchor.scale, 0, 0, Math.PI * 2);
    context.stroke();
    const rotation = seconds * Math.PI * 1.05;
    context.strokeStyle = '#77e7d494';
    context.beginPath();
    context.ellipse(anchor.x, anchor.y, 11 * anchor.scale, 5 * anchor.scale, 0, rotation - .72, rotation + .72);
    context.stroke();
    spot(anchor, Math.max(5, anchor.scale * 9));
    if (state.view !== 1) return;
    const peers = [(state.rack + 7) % cabinets.length, (state.rack + 15) % cabinets.length];
    for (const [index, peer] of peers.entries()) {
      const other = cabinets[peer];
      const end = point(other.x, -rackSize.height - 6, other.z);
      if (!end) continue;
      const middle = { x: (anchor.x + end.x) / 2, y: Math.min(anchor.y, end.y) - 33 - index * 11 };
      const phase = (seconds * .28 + index * .41) % 1;
      const inv = 1 - phase;
      const x = inv ** 2 * anchor.x + 2 * inv * phase * middle.x + phase ** 2 * end.x;
      const y = inv ** 2 * anchor.y + 2 * inv * phase * middle.y + phase ** 2 * end.y;
      context.strokeStyle = `rgba(107,226,214,${intensity * .58})`;
      context.setLineDash([3, 5]);
      context.beginPath();
      context.moveTo(anchor.x, anchor.y);
      context.quadraticCurveTo(middle.x, middle.y, end.x, end.y);
      context.stroke();
      context.setLineDash([]);
      context.fillStyle = '#8cefe0';
      context.fillRect(x - 1, y - 1, 2, 2);
      spot(end, Math.max(4, end.scale * 5));
    }
  }

  function uplink() {
    const cabinet = cabinets[state.rack];
    const { x, z, facing } = cabinet;
    const start = [x + facing * (rackSize.depth / 2 - 2), -rackSize.height + 5, z - facing * 26.5];
    const end = [x, trayY, z - facing * 26.5];
    const path = [
      start,
      [start[0] - facing * 4, -rackSize.height - 4, start[2]],
      [start[0] - facing * 8, trayY + 8, start[2]],
      [start[0] - facing * 20, trayY + 2, start[2]],
      end
    ].map(coords => point(...coords));
    if (path.some(value => !value)) return;
    for (let i = 0; i < 3; i += 1) {
      context.strokeStyle = wireColors[i];
      context.lineWidth = 1;
      context.beginPath();
      path.forEach((position, index) => {
        if (index === 0) context.moveTo(position.x + i * 1.6, position.y);
        else context.lineTo(position.x + i * 1.6, position.y);
      });
      context.stroke();
    }
  }

  function renderEffects(seconds) {
    context.clearRect(0, 0, width, height);
    if (!projection || state.view > 3 || !cabinets.length) return;
    floorFlow(seconds);
    if (state.view === 3) uplink();
    else connections(seconds);
  }

  const mix = (a, b, t) => a + (b - a) * t;
  let lastPaint = 0;
  let frame = 0;
  function paint(time) {
    frame = 0;
    if (transition) {
      const { start, from, to } = transition;
      const t = Math.min(1, (time - start) / 980);
      const ease = t * t * (3 - 2 * t);
      camera = {
        eye: from.eye.map((value, i) => mix(value, to.eye[i], ease)),
        target: from.target.map((value, i) => mix(value, to.target[i], ease)),
        focal: mix(from.focal, to.focal, ease)
      };
      if (t >= 1) transition = null;
      setCamera(camera);
    }
    if (!lastPaint || transition || reducedMotion.matches || time - lastPaint > 29) {
      renderEffects(reducedMotion.matches ? 0 : time / 1000);
      lastPaint = time;
    }
    if (transition || (!reducedMotion.matches && state.view < 4 && !document.hidden)) requestPaint();
  }

  function requestPaint() {
    if (!frame) frame = requestAnimationFrame(paint);
  }

  new ResizeObserver(() => {
    sizeCanvas();
    lastPaint = 0;
    requestPaint();
  }).observe(host);
  reducedMotion.addEventListener('change', requestPaint);
  document.addEventListener('visibilitychange', requestPaint);
  sizeCanvas();

  function update(records, next) {
    if (!cabinets.length) cabinets = records.map(cabinetAt);
    const previous = state;
    state = { ...next };
    if (state.view <= 3) detailView = state;
    for (const [index, cabinet] of cabinets.entries()) {
      const record = cabinet.record = records[index];
      const color = record.color || '#74ddca';
      const isSelected = index === state.rack;
      const isOpen = detailView?.view === 3 && index === detailView.rack;
      cabinet.element.style.setProperty('--signal', color);
      cabinet.element.classList.toggle('dc-room-current', state.mode === 'current');
      cabinet.element.classList.toggle('dc-room-active', isSelected);
      cabinet.element.classList.toggle('dc-room-open', isOpen);
      const [lid, left, right, , door] = cabinet.faces;
      lid.tabIndex = state.view === 1 ? 0 : -1;
      door.tabIndex = state.view === 2 ? 0 : -1;
      const ampReading = `${Number(record.amps || 0).toFixed(1)} A`;
      if (state.mode === 'current') cabinet.amp.textContent = ampReading;
      const detail = state.mode === 'current' ? ampReading : record.toneLabel;
      for (const face of [lid, left, right, door]) {
        face.title = detail ? `查看 ${record.id} · ${detail}` : `查看 ${record.id}`;
      }
      if (isOpen) {
        fillInterior(cabinet);
        cabinet.buttons.forEach((button, i) => {
          button.classList.toggle('dc-room-picked-unit', i === state.device);
          button.tabIndex = state.view === 3 ? 0 : -1;
        });
      }
    }
    const to = detailView ? viewpoint(detailView) : overview;
    if (!camera || reducedMotion.matches) {
      camera = to;
      transition = null;
      setCamera(camera);
    } else if (state.view <= 3 && (previous.view !== state.view || (previous.rack !== state.rack && state.view !== 1))) {
      transition = { start: performance.now(), from: camera, to };
    }
    lastPaint = 0;
    requestPaint();
  }

  return { update };
}

};

function devicePanelRepeat(count, render) {
  return Array.from({ length: count }, (_, index) => render(index)).join('');
}

function devicePanelEscape(value) {
  const characters = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  return String(value).replace(/[&<>"']/g, character => characters[character]);
}

function devicePanelMetrics(device) {
  const values = [
    ['进风温度', Number(device.temp).toFixed(1), '°C', 'cool'],
    ['排风温度', Number(device.exhaust).toFixed(1), '°C', 'warm'],
    ['实时功耗', Number(device.power).toFixed(2), 'kW', 'power'],
    ['当前负载', Number(device.load).toFixed(0), '%', 'load'],
  ];
  return values.map(([label, value, unit, color]) => `
    <div class="dcp-metric dcp-${color}">
      <span>${label}</span>
      <strong>${value}<small>${unit}</small></strong>
    </div>`).join('');
}

function devicePanelBays(device, profile) {
  if (device.type === 'switch') {
    return `
      <div class="dcp-port-array" style="--per-row:24">
        ${devicePanelRepeat(profile.ports, index => `
          <span class="dcp-front-port ${index % 13 < 10 ? 'dcp-linked' : ''}" title="端口 ${index + 1}">
            <i></i>${index + 1}
          </span>`)}
      </div>`;
  }

  const perRow = device.type === 'storage' ? 12 : device.type === 'blade' ? 16 : 8;
  return `<div class="dcp-bay-array" style="--per-row:${perRow}">
    ${devicePanelRepeat(profile.bays, index => {
      const warning = device.health === '注意' && index === 2;
      const idle = (device.type === 'blade' && index >= 14) || (device.type === 'storage' && index >= 22);
      return `<span class="dcp-bay${warning ? ' dcp-bay-warn' : ''}${idle ? ' dcp-bay-idle' : ''}" title="${profile.groups[0]} ${index + 1}">
        <span class="dcp-bay-grille"></span><i></i><b>${String(index + 1).padStart(2, '0')}</b>
      </span>`;
    })}
  </div>`;
}

function devicePanelFront(device, profile) {

function renderDevicePanel(host, rack, device, view, onView) {
  if (!host || !rack || !device) return;

  const profile = devicePanelTypes[device.type] || devicePanelTypes.server;
  const isOpen = view === 5;
  const health = devicePanelEscape(device.health);

const renderCharts = (() => {
  const surfaces = new Map();
  const chartInk = '#8a9bb1';
  const numberFont = 'Consolas, "SFMono-Regular", monospace';
  const labelFont = '"Microsoft YaHei UI", "PingFang SC", sans-serif';
  const rowColors = ['#24cfdd', '#508bfc', '#ad85fb', '#53d9aa'];
  const temperatureOffsets = [
    -1.60, -1.34, -1.72, -1.88, -1.55, -1.82, -1.67, -1.32, -0.97,

    1.031, 0.987, 1.01, 0.975, 1.009, 0.986, 1
  ];

  function clamp(value, minimum, maximum) {
    return Math.min(maximum, Math.max(minimum, value));
  }

  function chartText(context, value, x, y, options = {}) {
    const { color = chartInk, align = 'left', size = 11, font = numberFont, weight = 400 } = options;
    context.textAlign = align;
    context.textBaseline = 'middle';
    context.font = weight + ' ' + size + 'px ' + font;
    context.fillStyle = color;
    context.fillText(value, x, y);
  }

  function stroke(context, x1, y1, x2, y2, color) {
    context.save();
    context.strokeStyle = color;
    context.lineWidth = 1;
    context.beginPath();
    context.moveTo(x1, y1);
    context.lineTo(x2, y2);
    context.stroke();

  }

  function dot(context, x, y, radius, fill) {

    context.beginPath();
    context.arc(x, y, radius, 0, Math.PI * 2);

  }

  function horizontalGrid(context, plot, ticks, getY, format) {
    for (const tick of ticks) {

      context.setLineDash(tick === ticks[0] ? [] : [3, 4]);
      stroke(context, plot.left, y, plot.right, y, tick === ticks[0] ? '#304355' : '#26374a');

  }

  function showTooltip(surface, label, value, x, y) {
    surface.tooltipLabel.textContent = label;

    surface.tooltip.hidden = false;
    const width = surface.tooltip.offsetWidth;
    const height = surface.tooltip.offsetHeight;
    surface.tooltip.style.transform = 'translate(' +
      clamp(x - width / 2, 5, surface.width - width - 5) + 'px,' +
      clamp(y - height - 12, 1, surface.height - height - 1) + 'px)';
  }

  function trendTicks(values, unit) {
    const min = Math.min(...values);
    const max = Math.max(...values);
    const range = max - min;
    const target = Math.max(range * 0.28, 1);
    const magnitude = 10 ** Math.floor(Math.log10(target));
    const step = unit === '°C' ? 1
      : ([1, 1.5, 2, 2.5, 5, 10].find(factor => factor * magnitude >= target) || 10) * magnitude;
    const first = Math.max(0, Math.floor((min - range * 0.04) / step) * step);
    const last = Math.max(first + step, Math.ceil((max + range * 0.04) / step) * step);
    return Array.from({ length: Math.round((last - first) / step) + 1 }, (_, index) => first + step * index);
  }

  function drawTrend(surface) {
    const { context, width, height, data } = surface;

    const { values, unit, color } = data;
    const totalSteps = values.length - 1;
    const ticks = trendTicks(values, unit);
    const minimum = ticks[0];
    const range = ticks[ticks.length - 1] - minimum;
    const getY = value => plot.bottom - (value - minimum) / range * (plot.bottom - plot.top);
    const getX = index => plot.left + (plot.right - plot.left) * index / totalSteps;
    horizontalGrid(context, plot, ticks, getY, tick => unit === '°C' ? tick + '°' : String(Math.round(tick * 10) / 10));

    for (let index = 0; index <= totalSteps; index += 4) {
      const x = getX(index);
      context.setLineDash([2, 5]);
      stroke(context, x, plot.top, x, plot.bottom, '#1a2a3a');
      context.setLineDash([]);
      const isLatest = index === totalSteps;
      chartText(context, isLatest ? '当前' : '−' + (totalSteps - index) + 'h', x, plot.bottom + 14, {
        align: 'center', font: isLatest ? labelFont : numberFont, color: isLatest ? color : chartInk
      });
    }

    const points = values.map((value, index) => [getX(index), getY(value)]);
    const latest = points[totalSteps];
    const fill = context.createLinearGradient(0, plot.top, 0, plot.bottom);
    fill.addColorStop(0, color + '59');
    fill.addColorStop(1, color + '05');
    context.beginPath();
    context.moveTo(plot.left, plot.bottom);
    for (const [x, y] of points) context.lineTo(x, y);
    context.lineTo(plot.right, plot.bottom);
    context.closePath();
    context.fillStyle = fill;
    context.fill();

    context.beginPath();
    context.moveTo(...points[0]);
    for (const [x, y] of points.slice(1)) context.lineTo(x, y);
    context.lineWidth = 1.8;
    context.lineCap = 'round';
    context.lineJoin = 'round';
    context.strokeStyle = color;
    context.stroke();
    context.lineCap = 'butt';

    dot(context, ...latest, 7, color + '38');
    dot(context, ...latest, 3.4, color);
    dot(context, ...latest, 1.35, '#effdff');
    const latestText = values[totalSteps].toFixed(1) + ' ' + unit;
    const badgeX = latest[0] + 9;
    const badgeY = latest[1] - 10;
    context.fillStyle = color + '15';
    context.fillRect(badgeX, badgeY, 68, 20);
    context.lineWidth = 1;
    context.strokeStyle = color + '53';
    context.strokeRect(badgeX + 0.5, badgeY + 0.5, 67, 19);
    chartText(context, latestText, badgeX + 34, latest[1], {
      align: 'center', color, weight: 600, size: 12
    });

    if (surface.hovered !== null) {
      const [x, y] = points[surface.hovered];
      context.setLineDash([3, 3]);
      stroke(context, x, plot.top, x, plot.bottom, color + '90');
      context.setLineDash([]);
      dot(context, x, y, 4, color);
      dot(context, x, y, 1.8, '#effdff');
      const offset = totalSteps - surface.hovered;
      showTooltip(surface, offset ? offset + ' 小时前' : '当前',
        values[surface.hovered].toFixed(1) + ' ' + unit, x, y);
    }
  }

  function drawLoad(surface) {
    const { context, width, height, data } = surface;
    const { racks, selected } = data;
    const plot = surface.plot = { left: 50, top: 17, right: width - 18, bottom: height - 29 };
    const getY = value => plot.bottom - value / 100 * (plot.bottom - plot.top);
    const step = (plot.right - plot.left) / racks.length;
    const barWidth = Math.min(13, step * 0.63);
    horizontalGrid(context, plot, [0, 25, 50, 75, 100], getY, tick => tick + '%');
    let groupStart = 0;
    let groupIndex = 0;

    racks.forEach((rack, index) => {
      const color = rowColors[groupIndex % rowColors.length];
      const x = plot.left + (index + 0.5) * step;
      const y = getY(clamp(rack.load, 0, 100));

      if (emphasized) {
        context.fillStyle = color + '18';
        context.fillRect(x - step / 2 + 1, plot.top, step - 2, plot.bottom - plot.top);
      }

      const gradient = context.createLinearGradient(0, y, 0, plot.bottom);
      gradient.addColorStop(0, color + (emphasized ? 'ff' : 'df'));
      gradient.addColorStop(1, color + (emphasized ? '66' : '30'));
      context.fillStyle = gradient;
      context.fillRect(x - barWidth / 2, y, barWidth, plot.bottom - y);
      if (y < plot.bottom) stroke(context, x - barWidth / 2, y + 0.5, x + barWidth / 2, y + 0.5, emphasized ? '#e3fcff' : color);
      if (selected === index) {
        context.lineWidth = 1;
        context.strokeStyle = '#bdf8ff';
        context.strokeRect(x - barWidth / 2 - 1.5, y - 1.5, barWidth + 3, plot.bottom - y + 3);
      }

      if (!next || next.row !== rack.row) {
        const end = plot.left + (index + 1) * step;

        stroke(context, start + 5, plot.bottom + 5, end - 5, plot.bottom + 5, color + '5a');

        });

        groupIndex += 1;
      }

        showTooltip(surface, rack.id, Number(rack.load).toFixed(1) + '%', x, y);
      }
    });
  }

  function getSurface(id, isLoad) {
    if (surfaces.has(id)) return surfaces.get(id);
    const host = document.getElementById(id);
    const canvas = document.createElement('canvas');
    canvas.className = 'chart-surface';
    canvas.setAttribute('role', isLoad ? 'group' : 'img');

    function paint() {
      const width = host.clientWidth;
      const height = host.clientHeight;
      if (!surface.data || width < 170 || height < 55 || !surface.context) return;
      const density = Math.min(window.devicePixelRatio || 1, 2);
      const pixelWidth = Math.round(width * density);
      const pixelHeight = Math.round(height * density);
      if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
        canvas.width = pixelWidth;
        canvas.height = pixelHeight;
      }
      surface.width = width;
      surface.height = height;
      surface.context.setTransform(pixelWidth / width, 0, 0, pixelHeight / height, 0, 0);
      surface.context.clearRect(0, 0, width, height);
      tooltip.hidden = surface.hovered === null;
      if (isLoad) drawLoad(surface);
      else drawTrend(surface);
    }

    function getHover(event) {
      if (!surface.plot) return null;
      const rect = canvas.getBoundingClientRect();
      const { left, right, top, bottom } = surface.plot;
      const x = (event.clientX - rect.left) / rect.width * surface.width;
      const y = (event.clientY - rect.top) / rect.height * surface.height;
      if (x < left || x > right || y < top - 4 || y > bottom + 22) return null;
      const fraction = (x - left) / (right - left);
      if (!isLoad) return Math.round(fraction * (surface.data.values.length - 1));
      return Math.min(surface.data.racks.length - 1, Math.floor(fraction * surface.data.racks.length));
    }

    function setHover(index) {
      if (surface.hovered === index) return;
      surface.hovered = index;
      if (isLoad) canvas.style.cursor = index === null ? '' : 'pointer';
      paint();
    }

    canvas.addEventListener('pointermove', event => setHover(getHover(event)));
    canvas.addEventListener('pointerleave', () => setHover(null));
    if (isLoad) {
      canvas.tabIndex = 0;
      canvas.addEventListener('blur', () => setHover(null));
      canvas.addEventListener('click', event => {
        const index = getHover(event);
        if (index !== null && index >= 0) surface.data.onRack(index);
      });
      canvas.addEventListener('keydown', event => {
        const index = surface.hovered ?? surface.data.selected ?? 0;
        const lastIndex = surface.data.racks.length - 1;
        if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
          event.preventDefault();

    const current = currentFactors.map(factor => totalCurrent * factor);
    getSurface('chart-return', false).update({ values: temperature, unit: '°C', color: '#22d3ee' },

        return `<button type="button" class="zone-unit" data-rack="${index}" aria-pressed="false" aria-label="${label}" title="${label}" style="--tile:${getBand(rack, 'temp').color}">${rack.id.slice(-2)}</button>`;
      }).join('');
      return `<div class="zone"><div class="zone-text"><span>${group.letter} 区</span><span><b>${number(mean)}</b> <small>°C</small></span></div><div class="zone-strip">${tiles}</div></div>`;
    }).join('');
    zoneButtons.push(...$('zones').querySelectorAll('button'));
    zoneButtons.forEach(button => button.addEventListener('click', () => selectRack(Number(button.dataset.rack))));

    $('alert-count').textContent = `${alerts.length} 条活跃`;
    $('alerts').innerHTML = alerts.map(({ rack, index, high, title, value }, alertIndex) =>
      `<button type="button" class="alert-row" style="--severity:var(--${high ? 'red' : 'orange'})" data-alert-rack="${index}"><i class="dot" aria-hidden="true"></i><span class="alert-text"><span class="alert-title">${rack.id} · ${title}</span><span class="alert-subtitle">${value}</span></span><time class="alert-time" datetime="${alertTimes[alertIndex]}">${alertTimes[alertIndex]}</time></button>`
    ).join('');
    for (const button of $('alerts').querySelectorAll('button')) {
      button.addEventListener('click', () => selectRack(Number(button.dataset.alertRack)));
    }

    const ampsA = round(totals.amps * .54);
    const powerA = round(totals.power * .54, 2);
    const feeds = [
      { id: 'A', amps: ampsA, power: powerA, color: '#22d3ee' },
      { id: 'B', amps: totals.amps - ampsA, power: totals.power - powerA, color: '#71a8fb' }
    ];
    $('power-path').innerHTML = feeds.map(feed => {
      const share = Math.round(feed.power / totals.power * 100);
      return `<div class="feed" style="--feed:${feed.color};--feed-share:${share}%"><span>UPS-${feed.id}<small>${share}% 分流</small></span><strong>${number(feed.amps)}<small>A</small></strong><p>${number(feed.power, 2)} kW</p><div class="feed-meter" aria-hidden="true"><i></i></div></div>`;
    }).join('');
    $('power-total').textContent = `${number(totals.amps)} A  /  ${number(totals.power, 2)} kW`;
    $('chart-return-meta').textContent = `近 24 小时 / ${number(totals.return)} °C`;
    $('chart-current-meta').textContent = `近 24 小时 / ${number(totals.amps)} A`;
    $('chart-load-meta').textContent = `A–D 区 / ${racks.length} 台`;
  }

  function renderRack(rack) {
    const thermal = getBand(rack, 'temp');
    const used = sum(rack.devices, 'units');
    const isRackView = state.view === 3;
    $('rack-id').textContent = rack.id;
    $('rack-location').textContent = `${groups[rack.row].letter} 区 · 第 ${rack.col + 1} 列`;
    $('rack-u').textContent = `42U · 已用 ${used}U · ${rack.devices.length} 台设备`;
    $('rack-state').style.setProperty('--status', thermal.color);
    $('rack-state').innerHTML = `<i class="dot" aria-hidden="true"></i>${thermal.label}`;
    const metrics = [
      ['进风温度', number(rack.temp), '°C', thermal.color],
      ['出风温度', number(rack.exhaust), '°C'],
      ['机柜负载', rack.load, '%', getBand(rack, 'load').color],
      ['机柜电流', number(rack.amps), 'A'],
      ['IT 功率', number(rack.power, 2), 'kW'],
      ['进出风温差', number(rack.exhaust - rack.temp), '°C']
    ];
    $('rack-metrics').innerHTML = metrics.map(([label, value, unit, color = '#ddecf9']) =>
      `<div class="rack-metric" style="--metric-color:${color}"><small>${label}</small><b>${value}<em>${unit}</em></b></div>`
    ).join('');
    $('rack-work').textContent = rack.app;
    const action = isRackView ? '查看选中设备' : state.view > 3 ? '返回柜内设备' : '查看柜内设备';
    $('inspect-rack').innerHTML = `${action} <span aria-hidden="true">↗</span>`;
    const feedA = round(rack.amps * .54);
    $('power-rack').innerHTML = `<p><span>${rack.id} · PDU-A</span><b>${number(feedA)} A</b></p><p><span>${rack.id} · PDU-B</span><b>${number(rack.amps - feedA)} A</b></p>`;
    zoneButtons.forEach(button => button.setAttribute('aria-pressed', Number(button.dataset.rack) === state.rack));
  }

  function renderLegend() {
    if (state.mode === 'flow') {
      $('legend').innerHTML = `<span class="legend-title">数据流</span><span class="legend-item legend-flow" style="--swatch:#22d3ee"><i aria-hidden="true"></i>地面光点表示流动方向</span><span class="legend-item"><b>${racks.length}</b>台参与</span>`;
      return;
    }
    const mode = modes[state.mode];
    $('legend').innerHTML = `<span class="legend-title">${mode.title}</span>` + mode.bands.map(item => {
      const count = racks.filter(rack => getBand(rack, state.mode) === item).length;
      return `<span class="legend-item" style="--swatch:${item.color}"><i aria-hidden="true"></i>${item.label} <em>${item.range}</em><b>${count}</b>台</span>`;
    }).join('');
  }

  function renderUnitList(rack) {
    $('rack-units').hidden = state.view !== 3;
    if (state.view !== 3) return;
    $('rack-units-meta').textContent = `${rack.devices.length} 台 / 42U`;
    const typeColors = { switch: '#7daeff', server: '#59d6ec', storage: '#53d9ad', blade: '#b29cff' };
    unitList.innerHTML = rack.devices.map((device, index) => {
      const start = String(device.start).padStart(2, '0');
      const end = String(device.start + device.units - 1).padStart(2, '0');
      return `<li><button type="button" class="rack-unit-select" data-device-index="${index}" aria-pressed="${index === state.device}"><span class="u-range">U${start}–${end}</span><span class="u-kind" style="--kind-color:${typeColors[device.type]}"><i aria-hidden="true"></i>${device.name}</span><span class="u-arrow" aria-hidden="true">›</span></button></li>`;
    }).join('');
  }

  function render() {
    const rack = racks[state.rack];
    const device = rack.devices[state.device];
    const showDevice = state.view >= 4;
    $('viewport').dataset.view = state.view;
    $('view-name').textContent = viewNames[state.view - 1];
    $('scene-hint').textContent = viewHints[state.view - 1];
    $('scene-title').textContent = showDevice ? device.name : state.view === 3 ? `${rack.id} 机柜` : '主机房';
    $('scene-context').textContent = showDevice ? device.id : state.view === 3 ? 'DC-01 / 42U' : 'DC-01 / 4 排 × 6 列';
    viewButtons.forEach(button => button.setAttribute('aria-pressed', Number(button.dataset.view) === state.view));
    modeButtons.forEach(button => button.setAttribute('aria-pressed', button.dataset.mode === state.mode));
    renderRack(rack);
    renderLegend();
    renderUnitList(rack);
    const coloredRacks = racks.map(item => {
      const style = state.mode === 'flow' ? { color: '#51839e', label: '数据流' } : getBand(item, state.mode);
      return { ...item, color: style.color, toneLabel: style.label };
    });
    room.update(coloredRacks, state);
    sceneHost.inert = showDevice;
    deviceHost.hidden = !showDevice;
    if (showDevice) {
      const panelKey = `${state.view}-${device.id}`;
      if (deviceHost.dataset.panelKey !== panelKey) {
        deviceHost.dataset.deviceView = state.view;
        deviceHost.dataset.panelKey = panelKey;
        renderDevicePanel(deviceHost, rack, device, state.view, setView);
      }
    } else {
      delete deviceHost.dataset.panelKey;
      delete deviceHost.dataset.deviceView;
    }
    renderCharts(racks, state, selectRack);
  }

  function setView(view) {
    if (state.view === view) return;
    state.view = view;
    render();
  }

  function selectRack(index) {
    if (!racks[index] || state.rack === index) return;
    state.rack = index;
    state.device = rememberedDevice[index];
    if (state.view >= 4) state.view = 3;
    render();
  }

  function selectDevice(index) {
    if (!racks[state.rack].devices[index]) return;
    state.device = index;
    rememberedDevice[state.rack] = index;
    state.view = 4;
    render();
  }

  addEventListener('resize', fitDashboard);
  addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey || !/^[1-5]$/.test(event.key)) return;
    event.preventDefault();
    setView(Number(event.key));
  });
  viewButtons.forEach(button => button.addEventListener('click', () => setView(Number(button.dataset.view))));
  modeButtons.forEach(button => button.addEventListener('click', () => {
    if (button.dataset.mode === state.mode) return;
    state.mode = button.dataset.mode;
    render();
  }));
  $('inspect-rack').addEventListener('click', () => setView(state.view === 3 ? 4 : 3));
  unitList.addEventListener('click', event => {
    const button = event.target.closest('[data-device-index]');
    if (button) selectDevice(Number(button.dataset.deviceIndex));
  });
  fitDashboard();
  renderOverview();
  render();
})();
</script>
</body>
</html>
