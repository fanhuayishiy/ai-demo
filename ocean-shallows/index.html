  /* =========================================================
     棕榈树
     ========================================================= */
  function makeBarkTexture() {
    var c = document.createElement('canvas');
    c.width = 64; c.height = 256;
    var x = c.getContext('2d');
    x.fillStyle = '#6d573a';
    x.fillRect(0, 0, 64, 256);
    for (var i = 0; i < 320; i++) {
      var y = Math.random() * 256;
      var hh = 1.5 + Math.random() * 6;
      x.fillStyle = 'rgba(' + (52 + Math.random() * 46 | 0) + ',' +
        (40 + Math.random() * 34 | 0) + ',' + (26 + Math.random() * 22 | 0) + ',' +
        (0.20 + Math.random() * 0.45).toFixed(2) + ')';
      x.fillRect(0, y, 64, hh);
    }
    var g = x.createLinearGradient(0, 0, 64, 0);
    g.addColorStop(0, 'rgba(0,0,0,0.34)');
    g.addColorStop(0.35, 'rgba(255,255,255,0.12)');
    g.addColorStop(0.7, 'rgba(255,255,255,0.04)');
    g.addColorStop(1, 'rgba(0,0,0,0.36)');
    x.fillStyle = g;
    x.fillRect(0, 0, 64, 256);
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(1, 4);
    t.anisotropy = 4;
    return t;
  }

  function makeFrondTexture() {
    var W = 512, H = 168;
    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    var g = c.getContext('2d');
    g.clearRect(0, 0, W, H);
    var cy = H / 2;

    // 叶轴
    g.strokeStyle = '#5d7c31';
    g.lineWidth = 4.5;
    g.lineCap = 'round';
    g.beginPath();
    g.moveTo(2, cy);
    g.quadraticCurveTo(W * 0.55, cy - 4, W - 5, cy + 2);
    g.stroke();

    // 小羽叶
    for (var i = 0; i < 130; i++) {
      var tt = i / 130;
      var px = 6 + tt * (W - 22);
      var env = Math.pow(Math.sin(Math.PI * Math.min(1, tt * 1.03 + 0.03)), 0.5);
      for (var s = -1; s <= 1; s += 2) {
        var len = H * 0.52 * env * (0.72 + Math.random() * 0.55);
        if (len < 3) continue;
        var hue = 74 + Math.random() * 34;
        var lig = 15 + Math.random() * 17;
        g.strokeStyle = 'hsl(' + hue.toFixed(0) + ', ' + (34 + Math.random() * 20).toFixed(0) + '%, ' + lig.toFixed(0) + '%)';
        g.lineWidth = 1.4 + Math.random() * 1.9;
        g.beginPath();
        g.moveTo(px, cy);
        g.quadraticCurveTo(px + 9, cy + s * len * 0.6, px + 16 + len * 0.30, cy + s * len);
        g.stroke();
      }
    }
    var tex = new THREE.CanvasTexture(c);
    tex.anisotropy = 8;
    tex.minFilter = THREE.LinearMipMapLinearFilter;
    return tex;
  }

  function makeTaperedTube(curve, segs, radial, r0, r1) {
    var frames = curve.computeFrenetFrames(segs, false);
    var pos = [], nrm = [], uvs = [], idx = [];
    var p = new THREE.Vector3(), dir = new THREE.Vector3();
    for (var i = 0; i <= segs; i++) {
      var t = i / segs;
      curve.getPointAt(t, p);
      var N = frames.normals[i], B = frames.binormals[i];
      var rad = r0 + (r1 - r0) * t;
      for (var j = 0; j <= radial; j++) {
        var a = j / radial * Math.PI * 2;
        var cx = Math.cos(a), sy = Math.sin(a);
        dir.set(0, 0, 0).addScaledVector(N, cx).addScaledVector(B, sy).normalize();
        pos.push(p.x + dir.x * rad, p.y + dir.y * rad, p.z + dir.z * rad);
        nrm.push(dir.x, dir.y, dir.z);
        uvs.push(j / radial, t);
      }
    }
    for (var k = 0; k < segs; k++) {
      for (var m = 0; m < radial; m++) {
        var A = k * (radial + 1) + m;
        var Bq = A + 1;
        var C = A + (radial + 1);
        var D = C + 1;
        idx.push(A, C, Bq, Bq, C, D);
      }
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    g.setIndex(idx);
    return g;
  }

  function makeFrondGeometry(len, width, pitch, droop, segs) {
    var pos = [], uvs = [], idx = [];
    for (var i = 0; i <= segs; i++) {
      var t = i / segs;
      var x = t * len;
      var y = len * (Math.sin(pitch) * t - droop * t * t);
      for (var j = 0; j <= 2; j++) {
        var s = j / 2;
        var z = (s - 0.5) * width * (1.0 - 0.42 * t);
        var fold = Math.abs(s - 0.5) * len * 0.10;
        pos.push(x, y + fold, z);
        uvs.push(t, s);
      }
    }
    for (var a = 0; a < segs; a++) {
      for (var b = 0; b < 2; b++) {
        var i0 = a * 3 + b, i1 = i0 + 1, i2 = i0 + 3, i3 = i0 + 4;
        idx.push(i0, i1, i2, i1, i3, i2);
      }
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    g.setIndex(idx);
    g.computeVertexNormals();
    return g;
  }

  var palmRoot = new THREE.Group();
  var fronds = [];
  (function buildPalm() {
    // 树根落在沙滩上（与 GLSL 的 groundH 保持一致）
    function sstep(a, b, x) {
      var t = (x - a) / (b - a);
      t = t < 0 ? 0 : (t > 1 ? 1 : t);
      return t * t * (3 - 2 * t);
    }
    var dd = Math.hypot(PALM.x - SHORE_CX, PALM.z - SHORE_CZ) - SHORE_R;
    var dpos = Math.max(dd, 0);
    var baseY = -(0.098 * dpos + 0.0082 * dpos * dpos)
      + Math.pow(sstep(-2.0, -50.0, dd), 1.8) * 6.2
      + Math.exp(-Math.pow((dpos - 11.0) / 5.0, 2)) * 0.55
      + Math.exp(-Math.pow((dpos - 26.0) / 8.0, 2)) * 1.10 - 0.10;
    palmRoot.position.set(PALM.x, baseY, PALM.z);

    var curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, -7.0, 0),
      new THREE.Vector3(0.30, 2.3, 0.26),
      new THREE.Vector3(1.05, 4.7, 0.92),
      new THREE.Vector3(2.10, 7.0, 1.85),
      new THREE.Vector3(PALM_TOP.x, PALM_HEIGHT, PALM_TOP.y)
    ]);
    var trunkMat = new THREE.MeshLambertMaterial({ map: makeBarkTexture(), color: 0xb2a08a });
    var trunk = new THREE.Mesh(makeTaperedTube(curve, 30, 10, 0.72, 0.24), trunkMat);
    // 树干根部用一段渐粗的底座填平，避免露出圆筒截面
    var rootGeo = new THREE.SphereGeometry(0.82, 18, 12, 0, Math.PI * 2, 0, Math.PI * 0.62);
    var rootMesh = new THREE.Mesh(rootGeo, trunkMat);
    rootMesh.scale.set(1.0, 0.55, 1.0);
    rootMesh.position.set(0, 0.18, 0);
    palmRoot.add(rootMesh);
    palmRoot.add(trunk);



    // 树冠
    var canopy = new THREE.Group();
    canopy.position.set(PALM_TOP.x, PALM_HEIGHT, PALM_TOP.y);
    palmRoot.add(canopy);

    var frondTex = makeFrondTexture();
    var frondMat = new THREE.MeshLambertMaterial({
      map: frondTex,
      transparent: true,
      alphaTest: 0.42,
      side: THREE.DoubleSide,
      color: 0x9aa885
    });
    var frondMatDry = new THREE.MeshLambertMaterial({
      map: frondTex,
      transparent: true,
      alphaTest: 0.42,
      side: THREE.DoubleSide,
      color: 0xa89270
    });

    var pitches = [0.72, 0.56, 0.74, 0.48, 0.64, 0.40, 0.60, 0.34, 0.50];
    for (var i = 0; i < FROND_DEFS.length; i++) {
      var ang = FROND_DEFS[i][0];
      var len = FROND_DEFS[i][1];
      var geo = makeFrondGeometry(len, len * 0.62, pitches[i % pitches.length],
        0.58 + (i % 3) * 0.16, 16);
      var m = new THREE.Mesh(geo, i >= 7 ? frondMatDry : frondMat);
      m.rotation.y = ang;
      m.rotation.z = (i % 2 ? 1 : -1) * 0.035;
      // 记录基准角度，主循环里用来做摇摆
      m.userData.baseZ = m.rotation.z;
      m.userData.baseX = m.rotation.x;
      m.userData.phase = i * 0.83;
      m.userData.amp = 0.055 + (i % 3) * 0.022;
      fronds.push(m);
      canopy.add(m);
    }

    // 椰子
    var cocoMat = new THREE.MeshLambertMaterial({ color: 0x6b4a24 });
    var cocoPos = [[0.32, -0.30, 0.22], [-0.30, -0.34, 0.18], [0.02, -0.32, -0.34]];
    for (var c = 0; c < cocoPos.length; c++) {
      var sph = new THREE.Mesh(new THREE.SphereGeometry(0.30, 12, 10), cocoMat);
      sph.position.set(cocoPos[c][0], cocoPos[c][1], cocoPos[c][2]);
      canopy.add(sph);
    }
  })();
  scene.add(palmRoot);

  /* =========================================================
     鱼群：几种热带鱼 + 一小群银鱼
     鱼只在折射 pass 里渲染，于是水面会把它当作水下物体来吸收与折射
     ========================================================= */
  var fishRoot = new THREE.Group();
  scene.add(fishRoot);
  var fishShadow = null;

  function c01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function sstep01(a, b, x) {
    var t = c01((x - a) / (b - a));
    return t * t * (3 - 2 * t);
  }

  // 与 GLSL shoreD 一致的岸线距离（不含 fbm 细节）
  function shoreDJS(x, z) {
    var dx = x - SHORE_CX, dz = z - SHORE_CZ;
    var r = Math.sqrt(dx * dx + dz * dz);
    var a = Math.atan2(dz, dx);
    var wob = 2.35 * Math.sin(a * 3 + 0.65) + 1.30 * Math.sin(a * 5 - 1.15)
            + 0.62 * Math.sin(a * 8 + 2.30) + 0.28 * Math.sin(a * 14 - 0.80);
    return r - SHORE_R + wob;
  }

  // 与 GLSL groundH 一致的地形（略去小幅 fbm），用来让鱼待在水层里
  function seabedY(x, z) {
    var d = shoreDJS(x, z);
    var dd = Math.max(d, 0);
    var h = -(0.098 * dd + 0.0082 * dd * dd);
    h += Math.pow(sstep01(-2.0, -50.0, d), 1.8) * 6.2;
    h += Math.exp(-Math.pow((dd - 10.0) / 7.5, 2)) * 0.30;
    h += Math.exp(-Math.pow((dd - 27.0) / 13.0, 2)) * 0.55;
    return h;
  }

  /* =========================================================
     鱼：程序化建模
     身体是沿体长逐站生成的椭圆截面（不再是拉伸的球体），
     轮廓由样条控制，因此能做出圆头、厚身、细尾柄的真实鱼形。
     鳍全部按"附着在体表"的方式生成：基部贴合背部/腹部曲线，
     外缘带扇贝状缺刻，读起来像鳍条。
     ========================================================= */

  // 单调三次插值（Catmull-Rom 的切线用有限差分），用于体形轮廓
  function splineAt(pts, t) {
    var n = pts.length;
    if (t <= pts[0][0]) return pts[0][1];
    if (t >= pts[n - 1][0]) return pts[n - 1][1];
    var i = 0;
    while (i < n - 2 && pts[i + 1][0] < t) i++;
    var p1 = pts[i], p2 = pts[i + 1];
    var p0 = pts[Math.max(i - 1, 0)], p3 = pts[Math.min(i + 2, n - 1)];
    var h = Math.max(p2[0] - p1[0], 1e-4);
    var m1 = (p2[1] - p0[1]) / Math.max(p2[0] - p0[0], 1e-4);
    var m2 = (p3[1] - p1[1]) / Math.max(p3[0] - p1[0], 1e-4);
    var s = (t - p1[0]) / h, s2 = s * s, s3 = s2 * s;
    return (2 * s3 - 3 * s2 + 1) * p1[1] + (s3 - 2 * s2 + s) * h * m1
         + (-2 * s3 + 3 * s2) * p2[1] + (s3 - s2) * h * m2;
  }

  // 体形轮廓：u=0 吻端，u=1 尾柄
  function fishProfile(cfg) {
    var snout = cfg.snout === undefined ? 0.12 : cfg.snout;
    var peak = cfg.peak === undefined ? 0.32 : cfg.peak;
    var ped = cfg.peduncle === undefined ? 0.20 : cfg.peduncle;
    var H = [
      [0.000, snout * 0.30],
      [0.030, snout * 0.80],
      [0.070, snout * 1.55],
      [0.120, 0.68],
      [0.180, 0.88],
      [peak, 1.00],
      [peak + 0.10, 0.995],
      [0.56, 0.90],
      [0.68, 0.74],
      [0.80, 0.52],
      [0.90, ped + 0.10],
      [1.000, ped]
    ];
    var W = [
      [0.000, 0.34],
      [0.060, 0.62],
      [0.150, 0.88],
      [peak, 1.00],
      [0.52, 0.94],
      [0.70, 0.70],
      [0.86, 0.38],
      [1.000, 0.22]
    ];
    if (cfg.profH) H = cfg.profH;
    if (cfg.profW) W = cfg.profW;
    return {
      h: function (u) { return splineAt(H, Math.max(0, Math.min(1, u))); },
      w: function (u) { return splineAt(W, Math.max(0, Math.min(1, u))); }
    };
  }

  function bodyAt(cfg, u) {
    var hh = cfg.hgt * 0.5 * cfg._prof.h(u);
    var ww = cfg.wid * 0.5 * cfg._prof.w(u);
    return { hh: hh, ww: ww, x: cfg.len * (0.5 - u) };
  }

  function geoFrom(pos, col, uv, idx) {
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    if (idx) g.setIndex(idx);
    g.computeVertexNormals();
    return g;
  }

  function prep(geo) {
    if (!geo.attributes.normal) geo.computeVertexNormals();
    return geo.index ? geo.toNonIndexed() : geo;
  }

  function paintGeo(geo, hex) {
    var g = geo.index ? geo.toNonIndexed() : geo;
    var n = g.attributes.position.count;
    var arr = new Float32Array(n * 3);
    var c = new THREE.Color(hex);
    for (var i = 0; i < n; i++) {
      arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b;
    }
    g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
    return g;
  }

  function mergeGeos(list) {
    var total = 0, i, g;
    var prepped = [];
    for (i = 0; i < list.length; i++) {
      g = prep(list[i]);
      prepped.push(g);
      total += g.attributes.position.count;
    }
    var pos = new Float32Array(total * 3);
    var nor = new Float32Array(total * 3);
    var uv  = new Float32Array(total * 2);
    var col = new Float32Array(total * 3);
    var o = 0;
    for (i = 0; i < prepped.length; i++) {
      g = prepped[i];
      var n = g.attributes.position.count;
      pos.set(g.attributes.position.array, o * 3);
      if (g.attributes.normal) nor.set(g.attributes.normal.array, o * 3);
      if (g.attributes.uv) uv.set(g.attributes.uv.array, o * 2);
      if (g.attributes.color) col.set(g.attributes.color.array, o * 3);
      o += n;
    }
    var out = new THREE.BufferGeometry();
    out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    out.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    out.setAttribute('color', new THREE.BufferAttribute(col, 3));
    return out;
  }

  // ---- 身体：逐站椭圆截面 + 头尾封口 ----
  function buildFishBody(cfg) {
    var NL = 34, NR = 22;
    var len = cfg.len, hgt = cfg.hgt, wid = cfg.wid;
    var pos = [], uv = [], col = [], idx = [];
    var lastRing = 0;

    // 截面：腹部略平，背部略收，形成鱼的横截面感
    for (var i = 0; i <= NL; i++) {
      var t = i / NL;
      var b = bodyAt(cfg, t);
      for (var j = 0; j <= NR; j++) {
        var th = 2 * Math.PI * j / NR;
        var cs = Math.cos(th), sn = Math.sin(th);
        var y = b.hh * cs * (cs < 0 ? 0.90 : 1.00);
        // 背部加一道很浅的脊
        var z = b.ww * sn * (cs > 0.55 ? 0.95 : 1.0);
        pos.push(b.x, y, z);
        // v：0=背，0.5=腹，1=背（纹理按对称渐变画）
        uv.push(t, j / NR);
        // 尾柄与下颌略暗，增加体积
        var ao = 1
          - 0.20 * sstep01(0.72, 1.0, t)
          - 0.10 * Math.max(0, -cs) * sstep01(0.35, 0.0, t);
        col.push(ao, ao, ao);
      }
      lastRing = i;
    }
    for (var i2 = 0; i2 < NL; i2++) {
      for (var j2 = 0; j2 < NR; j2++) {
        var a = i2 * (NR + 1) + j2, bb = a + 1, c2 = a + (NR + 1), d = c2 + 1;
        idx.push(a, c2, bb, bb, c2, d);
      }
    }

    // 吻端封口
    var headIdx = pos.length / 3;
    pos.push(len * 0.5 + len * 0.012, 0, 0);
    uv.push(0, 0.25);
    col.push(0.94, 0.94, 0.94);
    for (var j3 = 0; j3 < NR; j3++) {
      var r0 = 0 * (NR + 1) + j3, r1 = r0 + 1;
      idx.push(headIdx, r0, r1);
    }
    // 尾柄封口
    var tailIdx = pos.length / 3;
    pos.push(-len * 0.5 - len * 0.006, 0, 0);
    uv.push(1, 0.25);
    col.push(0.80, 0.80, 0.80);
    var base = lastRing * (NR + 1);
    for (var j4 = 0; j4 < NR; j4++) {
      var s0 = base + j4, s1 = s0 + 1;
      idx.push(tailIdx, s1, s0);
    }

    return geoFrom(pos, col, uv, idx);
  }

  // ---- 背鳍 / 臀鳍：沿背部中线竖起的薄片，外缘平滑后倾 ----
  function buildRidgeFin(cfg, u0, u1, height, side, opt) {
    opt = opt || {};
    var N = 26, M = 3;
    var pos = [], uv = [], col = [], idx = [];
    var finC = new THREE.Color(cfg.fin);
    var deep = finC.clone().multiplyScalar(0.72);
    var tipC = finC.clone().multiplyScalar(1.10);
    var thick = cfg.wid * 0.055;   // 极薄，但有厚度，避免退化成纸片

    for (var i = 0; i <= N; i++) {
      var s = i / N;
      var u = u0 + (u1 - u0) * s;
      var b = bodyAt(cfg, u);
      var by = side * b.hh * 0.94;

      // 外缘轮廓：中央最高，两端平滑收尖。
      // 用柔和的 envelope，不再叠正弦——正弦会产生尖刺状锯齿。
      var env = Math.pow(Math.sin(Math.PI * Math.pow(s, 0.90)), 0.62);
      var hh = height * env;

      for (var j = 0; j <= M; j++) {
        var f = j / M;
        // 鳍向外伸出，同时越往外越向后倾（真实的背鳍是后掠的）
        var y = by + side * hh * f;
        var x = b.x - hh * f * f * 0.34;
        // 厚度：中间略厚，边缘收薄
        var zp = thick * (1.0 - 0.55 * f * f);
        for (var kz = 0; kz < 2; kz++) {
          var z = (kz === 0 ? zp : -zp);
          pos.push(x, y, z);
          uv.push(u, f);
          var cc = deep.clone().lerp(tipC, Math.pow(f, 0.55));
          col.push(cc.r, cc.g, cc.b);
        }
      }
    }
    var stride = (M + 1) * 2;
    for (var i2 = 0; i2 < N; i2++) {
      for (var j2 = 0; j2 < M; j2++) {
        for (var kz2 = 0; kz2 < 2; kz2++) {
          var a = i2 * stride + j2 * 2 + kz2;
          var bb = a + 2;
          var c2 = a + 1 - 2 * kz2;
          var d = bb + 1 - 2 * kz2;
          if (kz2 === 0) idx.push(a, bb, c2, c2, bb, d);
          else idx.push(a, c2, bb, c2, d, bb);
        }
      }
    }
    return geoFrom(pos, col, uv, idx);
  }

  // ---- 腹鳍 / 臀鳍片：从腹面中线向后下方伸出的两片小叶 ----
  function buildBellyFin(cfg, u, side, size, spread) {
    var b = bodyAt(cfg, u);
    var finC = new THREE.Color(cfg.fin);
    var deep = finC.clone().multiplyScalar(0.72);
    var tipC = finC.clone().multiplyScalar(1.14);
    var pos = [], uv = [], col = [], idx = [];
    var N = 8;
    // 根部在腹面稍偏一侧
    var root = [b.x, side * b.hh * 0.90, spread * b.ww * 0.55];
    for (var i = 0; i <= N; i++) {
      var s = i / N;
      // 叶形：向后下方展开，末端收尖
      var rr = size * Math.pow(s, 0.78);
      var x = root[0] - rr * 0.92;
      var y = root[1] + side * rr * 0.62;
      // 顺着体侧向外张开一点
      var z = root[2] + (spread * b.ww * 0.55 - root[2]) * Math.pow(s, 0.9);
      pos.push(x, y, z);
      uv.push(s, 1);
      var cc = deep.clone().lerp(tipC, Math.pow(s, 0.7));
      col.push(cc.r, cc.g, cc.b);
    }
    pos.push(root[0], root[1], root[2]);
    uv.push(0, 0);
    col.push(deep.r, deep.g, deep.b);
    var ci = pos.length / 3 - 1;
    for (var j = 0; j < N; j++) idx.push(ci, j, j + 1);
    return geoFrom(pos, col, uv, idx);
  }

  // ---- 尾鳍：上下两叶 + 缺口，尾缘带缺刻并略向后弯 ----
  function buildTailFin(cfg) {
    var lenT = cfg.len * (cfg.tailLen || 0.40);
    var spread = cfg.hgt * (cfg.tailSpread || 0.42);
    var notch = cfg.notch === undefined ? 0.28 : cfg.notch;
    var r0 = cfg.hgt * 0.14;           // 根部高度
    var finC = new THREE.Color(cfg.fin);
    var deep = finC.clone().multiplyScalar(0.70);
    var tipC = finC.clone().multiplyScalar(1.14);

    // 沿轮廓采样，最后以根部中心做扇形三角化（该轮廓是星形，可行）
    var outline = [], colr = [], uvs = [];
    var NU = 11, NT = 9;

    function push(x, y, f) {
      outline.push(x, y);
      uvs.push(f, 0.5);
      var cc = deep.clone().lerp(tipC, Math.pow(f, 0.65));
      colr.push(cc.r, cc.g, cc.b);
    }

    // 上叶前缘：根部 → 尖端
    for (var i = 0; i <= NU; i++) {
      var s = i / NU;
      var x = -lenT * Math.pow(s, 0.86);
      var y = r0 + (spread - r0) * Math.pow(s, 0.70);
      push(x, y, 0.15 + 0.85 * s);
    }
    // 上叶尾缘：尖端 → 缺口（带缺刻）
    for (var i2 = 1; i2 <= NT; i2++) {
      var s2 = i2 / NT;
      var x2 = -lenT * (1 - notch * s2) + lenT * 0.035 * Math.sin(s2 * Math.PI * 4.0);
      var y2 = spread * (1 - s2);
      push(x2, y2, 1.0);
    }
    // 下叶尾缘：缺口 → 尖端
    for (var i3 = 1; i3 <= NT; i3++) {
      var s3 = i3 / NT;
      var x3 = -lenT * (1 - notch * (1 - s3)) + lenT * 0.035 * Math.sin(s3 * Math.PI * 4.0);
      var y3 = -spread * s3;
      push(x3, y3, 1.0);
    }
    // 下叶前缘：尖端 → 根部
    for (var i4 = 1; i4 <= NU; i4++) {
      var s4 = 1 - i4 / NU;
      var x4 = -lenT * Math.pow(s4, 0.86);
      var y4 = -(r0 + (spread - r0) * Math.pow(s4, 0.70));
      push(x4, y4, 0.15 + 0.85 * s4);
    }

    // 组装：扇形，中心在原点
    var pos = [], uv = [], col = [], idx = [];
    pos.push(0, 0, 0); uv.push(0, 0.5);
    col.push(deep.r, deep.g, deep.b);
    var n = outline.length / 2;
    for (var k = 0; k < n; k++) {
      var ox = outline[k * 2], oy = outline[k * 2 + 1];
      // 尾叶略向后弯（z 方向），从俯视角度看才有立体感
      var oz = 0.20 * cfg.wid * Math.pow(Math.abs(ox) / lenT, 2.0);
      pos.push(ox, oy, oz);
      uv.push(uvs[k * 2], uvs[k * 2 + 1]);
      col.push(colr[k * 3], colr[k * 3 + 1], colr[k * 3 + 2]);
    }
    for (var k2 = 0; k2 < n; k2++) {
      idx.push(0, k2 + 1, ((k2 + 1) % n) + 1);
    }
    return geoFrom(pos, col, uv, idx);
  }

  // ---- 胸鳍：一片椭圆小扇，从鳃盖后方的体侧向外张开 ----
  function buildPecFin(cfg, sign) {
    var pecLen = cfg.len * (cfg.pecLen || 0.20);
    var b = bodyAt(cfg, cfg.pecU || 0.17);
    var finC = new THREE.Color(cfg.fin);
    var deep = finC.clone().multiplyScalar(0.70);
    var tipC = finC.clone().multiplyScalar(1.16);
    var pos = [], uv = [], col = [], idx = [];

    // 用"椭圆扇"描述：沿角度展开，半径按椭圆包络变化
    var N = 12;
    // 叶片根部在原点（枢轴），朝 +x 稍后、+z 外张
    var a0 = -0.55, a1 = 0.55;   // 展开角范围（相对于外张方向）
    for (var i = 0; i <= N; i++) {
      var s = i / N;
      var ang = a0 + (a1 - a0) * s;
      // 椭圆半径：中间最长，两端收窄
      var rr = pecLen * Math.pow(Math.sin(Math.PI * Math.min(s * 1.02, 1)), 0.55);
      rr = Math.max(rr, pecLen * 0.06);
      // 局部坐标：x 向后、z 向外、y 略下垂
      var x = -rr * Math.sin(ang) * 0.80;
      var z = sign * rr * Math.cos(ang);
      var y = -rr * 0.22 * (1 - Math.cos(ang));
      pos.push(x, y, z);
      uv.push(s, 1);
      var cc = deep.clone().lerp(tipC, Math.pow(Math.sin(Math.PI * s), 0.6));
      col.push(cc.r, cc.g, cc.b);
    }
    // 根部中心
    pos.push(0, 0, 0);
    uv.push(0.5, 0);
    col.push(deep.r, deep.g, deep.b);
    var ci = pos.length / 3 - 1;
    for (var j = 0; j < N; j++) idx.push(ci, j, j + 1);

    var g = geoFrom(pos, col, uv, idx);
    // 枢轴：贴在体侧、鳃盖后方
    g.userData.pivot = { x: b.x, y: b.hh * 0.05, z: sign * b.ww * 0.82 };
    return g;
  }

  // ---- 眼睛：眼白 + 瞳孔 + 高光 ----
  function buildEyes(cfg) {
    var b = bodyAt(cfg, cfg.eyeU || 0.135);
    var er = Math.min(cfg.hgt * 0.115, b.ww * 0.66);
    var out = [];
    for (var s = -1; s <= 1; s += 2) {
      var ex = b.x + cfg.len * 0.005;
      var ey = b.hh * 0.24;
      var ez = s * b.ww * 0.80;
      var g1 = new THREE.SphereGeometry(er, 9, 7);
      g1.translate(ex, ey, ez);
      out.push(paintGeo(g1, cfg.eyeWhite || '#efe6d2'));

      var g2 = new THREE.SphereGeometry(er * 0.60, 9, 7);
      g2.translate(ex + er * 0.10, ey, ez + s * er * 0.52);
      out.push(paintGeo(g2, cfg.eye || '#12121a'));

      var g3 = new THREE.SphereGeometry(er * 0.24, 7, 5);
      g3.translate(ex + er * 0.30, ey + er * 0.30, ez + s * er * 0.62);
      out.push(paintGeo(g3, '#ffffff'));
    }
    return out;
  }

  // ---- 鱼种装配 ----
  function buildFishParts(cfg) {
    cfg._prof = fishProfile(cfg);

    var body = buildFishBody(cfg);

    var statics = [];
    // 背鳍
    statics.push(buildRidgeFin(cfg, cfg.dorsalU0 === undefined ? 0.20 : cfg.dorsalU0,
      cfg.dorsalU1 === undefined ? 0.78 : cfg.dorsalU1,
      cfg.hgt * (cfg.dorsal || 0.34), 1, { lobes: cfg.dorsalLobes || 6 }));
    // 臀鳍
    statics.push(buildRidgeFin(cfg, 0.56, 0.86, cfg.hgt * (cfg.anal || 0.24), -1,
      { lobes: 4, wave: 0.14, bulge: 0.04 }));
    // 腹鳍（一对）
    statics.push(buildBellyFin(cfg, 0.34, -1, cfg.hgt * 0.20, 0.50));
    statics.push(buildBellyFin(cfg, 0.34, -1, cfg.hgt * 0.18, -0.50));
    // 眼睛
    var eyes = buildEyes(cfg);
    for (var i = 0; i < eyes.length; i++) statics.push(eyes[i]);

    var staticGeo = mergeGeos(statics);
    var tailGeo = buildTailFin(cfg);
    var pecL = buildPecFin(cfg, 1);
    var pecR = buildPecFin(cfg, -1);

    return {
      body: body, static: staticGeo, tail: tailGeo,
      pecL: pecL, pecR: pecR,
      tailOff: cfg.len * 0.5
    };
  }

  // ---- 鱼皮：u=体长方向（0 吻端 → 1 尾柄），v 绕体一周（0 背 → 0.5 腹 → 1 背）----
  function makeFishSkin(cfg) {
    var W = 512, H = 256;
    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    var g = c.getContext('2d');

    // 1) 背深腹浅的对称渐变（v 绕体一周，两端都是背部）
    var grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0.00, cfg.back);
    grad.addColorStop(0.16, cfg.back);
    grad.addColorStop(0.34, cfg.base);
    grad.addColorStop(0.50, cfg.belly);
    grad.addColorStop(0.66, cfg.base);
    grad.addColorStop(0.84, cfg.back);
    grad.addColorStop(1.00, cfg.back);
    g.fillStyle = grad;
    g.fillRect(0, 0, W, H);

    // 2) 背部再加一层压暗，强化"上深下浅"
    var dg = g.createLinearGradient(0, 0, 0, H);
    dg.addColorStop(0.00, 'rgba(0,0,0,0.22)');
    dg.addColorStop(0.22, 'rgba(0,0,0,0.04)');
    dg.addColorStop(0.50, 'rgba(255,255,255,0.06)');
    dg.addColorStop(0.78, 'rgba(0,0,0,0.04)');
    dg.addColorStop(1.00, 'rgba(0,0,0,0.22)');
    g.fillStyle = dg;
    g.fillRect(0, 0, W, H);

    // 3) 竖带（小丑鱼的白带 / 唐王的深色带 / 神仙鱼的条纹）
    if (cfg.stripes) {
      for (var i = 0; i < cfg.stripes.length; i++) {
        var st = cfg.stripes[i];
        var x0 = st.at * W;
        var w = st.w * W;
        var cu = (st.curve === undefined ? 0 : st.curve) * (W / 512);
        // 黑边
        if (st.edge) {
          g.fillStyle = st.edge;
          band(g, x0, w + 5, cu);
        }
        g.fillStyle = st.color;
        band(g, x0, w, cu);
      }
    }

    function band(ctx, x, w, cu) {
      ctx.beginPath();
      ctx.moveTo(x - cu, -8);
      ctx.quadraticCurveTo(x + cu * 0.35, H * 0.5, x - cu, H + 8);
      ctx.lineTo(x - cu - w, H + 8);
      ctx.quadraticCurveTo(x - cu - w + cu * 0.35, H * 0.5, x - cu - w, -8);
      ctx.closePath();
      ctx.fill();
    }

    // 4) 鳃盖：一条弧线 + 后面的浅影
    var gx = (cfg.gillU === undefined ? 0.115 : cfg.gillU) * W;
    g.globalAlpha = 0.22;
    g.strokeStyle = '#000000';
    g.lineWidth = 2.2;
    g.beginPath();
    g.moveTo(gx, H * 0.16);
    g.quadraticCurveTo(gx + 13, H * 0.5, gx, H * 0.84);
    g.stroke();
    g.globalAlpha = 0.10;
    g.fillStyle = '#000000';
    g.beginPath();
    g.moveTo(gx, H * 0.16);
    g.quadraticCurveTo(gx + 13, H * 0.5, gx, H * 0.84);
    g.lineTo(gx - H * 0.30, H * 0.90);
    g.lineTo(gx - H * 0.30, H * 0.10);
    g.closePath();
    g.fill();
    g.globalAlpha = 1;

    // 5) 侧线：两侧各一条断续的细线（v=0.25 / 0.75 即体侧）
    g.globalAlpha = 0.13;
    g.strokeStyle = '#000000';
    g.lineWidth = 1.4;
    for (var s = 0; s < 2; s++) {
      var ly = s === 0 ? H * 0.25 : H * 0.75;
      for (var x = W * 0.10; x < W * 0.92; x += 9) {
        g.beginPath();
        g.moveTo(x, ly);
        g.lineTo(x + 5, ly + 0.6);
        g.stroke();
      }
    }
    g.globalAlpha = 1;

    // 6) 鳞片：交错的弧形网格，靠近体侧更明显
    g.globalAlpha = 0.09;
    g.strokeStyle = '#ffffff';
    g.lineWidth = 1.1;
    var rowH = H / 13;
    for (var r = 0; r < 14; r++) {
      var y = r * rowH;
      var off = (r % 2) * (W / 44);
      for (var x2 = -W / 44; x2 < W + W / 44; x2 += W / 22) {
        g.beginPath();
        g.arc(x2 + off, y, W / 44, -0.35, 0.35);
        g.stroke();
      }
    }
    g.globalAlpha = 0.06;
    g.strokeStyle = '#000000';
    for (var r2 = 0; r2 < 14; r2++) {
      var y2 = r2 * rowH + rowH * 0.5;
      var off2 = (r2 % 2) * (W / 44);
      for (var x3 = -W / 44; x3 < W + W / 44; x3 += W / 22) {
        g.beginPath();
        g.arc(x3 + off2, y2, W / 44, -0.30, 0.30);
        g.stroke();
      }
    }
    g.globalAlpha = 1;

    // 7) 头部与吻端：略暗，并画出嘴线
    var hg = g.createLinearGradient(0, 0, W * 0.10, 0);
    hg.addColorStop(0, 'rgba(0,0,0,0.26)');
    hg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = hg;
    g.fillRect(0, 0, W * 0.10, H);
    g.strokeStyle = 'rgba(0,0,0,0.34)';
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(W * 0.012, H * 0.40);
    g.quadraticCurveTo(W * 0.045, H * 0.50, W * 0.012, H * 0.60);
    g.stroke();

    var t = new THREE.CanvasTexture(c);
    t.wrapS = THREE.ClampToEdgeWrapping;
    t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = 4;
    return t;
  }

  var skinCache = {};
  function fishSkin(cfg) {
    if (!skinCache[cfg.name]) skinCache[cfg.name] = makeFishSkin(cfg);
    return skinCache[cfg.name];
  }

  // ---- 水下的鱼影：一个实例化网格承载全部 ----
  var shadowGeo = new THREE.CircleGeometry(1, 18);
  shadowGeo.rotateX(-Math.PI / 2);
  // 鱼影：要淡。深色椭圆在浅色海床上会像一块脏污，而不是影子。
  var shadowMat = new THREE.MeshBasicMaterial({
    color: 0x14333d, transparent: true, opacity: 0.085, depthWrite: false
  });

  // ---- 鱼种 ----
  //  profile 参数：snout=吻端厚薄 peak=最厚处位置 peduncle=尾柄粗细
  //  dorsal/anal=背鳍与臀鳍高度（相对体高） tailSpread/notch/tailLen=尾形
  var FISH_KINDS = [
    { // 小丑鱼：卵形、钝吻、三条白带带黑边
      name: 'clown', len: 1.78, hgt: 1.18, wid: 0.70, fin: '#f5842a',
      base: '#ff6b0a', back: '#c03f00', belly: '#ffc078',
      snout: 0.13, peak: 0.32, peduncle: 0.22,
      dorsal: 0.30, anal: 0.22, dorsalU0: 0.22, dorsalU1: 0.80,
      tailSpread: 0.36, notch: 0.22, tailLen: 0.34,
      stripes: [
        { at: 0.165, w: 0.058, color: '#fdf8ee', edge: 'rgba(38,20,10,0.55)', curve: -6 },
        { at: 0.500, w: 0.080, color: '#fdf8ee', edge: 'rgba(38,20,10,0.55)', curve: 10 },
        { at: 0.815, w: 0.048, color: '#fdf8ee', edge: 'rgba(38,20,10,0.55)', curve: 4 }
      ]
    },
    { // 蓝唐王鱼：盘状、吻略尖、蓝色体侧一道深色带
      name: 'tang', len: 2.52, hgt: 1.86, wid: 0.60, fin: '#f2c81e',
      base: '#1657e0', back: '#0b2461', belly: '#79b8f2',
      snout: 0.16, peak: 0.34, peduncle: 0.17,
      dorsal: 0.24, anal: 0.26, dorsalU0: 0.16, dorsalU1: 0.86,
      tailSpread: 0.30, notch: 0.30, tailLen: 0.30,
      stripes: [{ at: 0.66, w: 0.15, color: '#0a2050', curve: 16 }]
    },
    { // 黄高鳍刺尾鱼：盘状、很高的背鳍
      name: 'yellow', len: 2.05, hgt: 1.80, wid: 0.52, fin: '#f8dc55',
      base: '#ffd400', back: '#d09b00', belly: '#fff2ac',
      snout: 0.15, peak: 0.33, peduncle: 0.18,
      dorsal: 0.42, anal: 0.40, dorsalU0: 0.18, dorsalU1: 0.84,
      dorsalLobes: 5,
      tailSpread: 0.28, notch: 0.26, tailLen: 0.30
    },
    { // 神仙鱼：极高的盘状体，背臀鳍拖长
      name: 'angel', len: 2.85, hgt: 2.05, wid: 0.54, fin: '#e9c53a',
      base: '#f6f1e4', back: '#c9bfa8', belly: '#fffdf8',
      snout: 0.18, peak: 0.36, peduncle: 0.14,
      dorsal: 0.46, anal: 0.44, dorsalU0: 0.14, dorsalU1: 0.88, dorsalLobes: 4,
      tailSpread: 0.30, notch: 0.34, tailLen: 0.32,
      stripes: [
        { at: 0.20, w: 0.070, color: '#2b2b30', curve: -8 },
        { at: 0.50, w: 0.085, color: '#2b2b30', curve: 10 },
        { at: 0.78, w: 0.055, color: '#2b2b30', curve: 4 }
      ]
    },
    { // 青梭鱼：细长、吻尖、尾深叉
      name: 'needle', len: 4.30, hgt: 0.62, wid: 0.40, fin: '#b9cfd6',
      base: '#9fb9c2', back: '#3d6474', belly: '#e8f2f5',
      snout: 0.34, peak: 0.26, peduncle: 0.26,
      dorsal: 0.30, anal: 0.26, dorsalU0: 0.20, dorsalU1: 0.74,
      tailSpread: 0.34, notch: 0.44, tailLen: 0.30, pecLen: 0.16
    },
    { // 银鱼：小、细、成群
      name: 'silver', len: 1.10, hgt: 0.44, wid: 0.28, fin: '#c9dbe3',
      base: '#c3d7de', back: '#6b8b9b', belly: '#f0f7f9',
      snout: 0.22, peak: 0.28, peduncle: 0.22,
      dorsal: 0.26, anal: 0.22,
      tailSpread: 0.32, notch: 0.40, tailLen: 0.32
    },
    { // 蝴蝶鱼：极高极薄，吻尖，眼后一道黑带
      name: 'bfly', len: 2.30, hgt: 1.62, wid: 0.52, fin: '#f4e9a8',
      base: '#ffe14d', back: '#d8a800', belly: '#fffbdc',
      snout: 0.30, peak: 0.36, peduncle: 0.15,
      dorsal: 0.40, anal: 0.42, dorsalU0: 0.16, dorsalU1: 0.86, dorsalLobes: 5,
      tailSpread: 0.26, notch: 0.24, tailLen: 0.28,
      stripes: [
        { at: 0.155, w: 0.095, color: '#26262c', curve: 6 },
        { at: 0.70, w: 0.040, color: '#26262c', curve: 3 }
      ]
    }
  ];

  // 巡游路线：都在较深的海域（离岸 20~40m，水深 4~9m）
  var FISH_ROUTES = {
    clown: [{ cx: 2.0, cz: -6.0, rx: 4.6, rz: 3.0, speed: 0.28, phase: 0.4 },
            { cx: 9.5, cz: -1.5, rx: 4.0, rz: 3.0, speed: 0.33, phase: 2.6 },
            { cx: -3.5, cz: 2.5, rx: 3.6, rz: 2.8, speed: 0.31, phase: 4.4 }],
    tang: [{ cx: 5.5, cz: -12.0, rx: 5.0, rz: 3.4, speed: 0.22, phase: 1.2 },
           { cx: 12.0, cz: 4.0, rx: 4.4, rz: 3.2, speed: 0.27, phase: 3.9 }],
    yellow: [{ cx: -1.0, cz: -13.0, rx: 4.2, rz: 3.0, speed: 0.28, phase: 0.9 },
             { cx: 8.0, cz: 7.5, rx: 4.0, rz: 3.0, speed: 0.26, phase: 5.1 }],
    angel: [{ cx: 14.0, cz: -7.0, rx: 4.6, rz: 3.2, speed: 0.18, phase: 2.0 }],
    needle: [{ cx: 4.0, cz: 9.0, rx: 6.4, rz: 4.2, speed: 0.21, phase: 4.0 }],
    bfly: [{ cx: 10.5, cz: -4.0, rx: 3.6, rz: 2.6, speed: 0.24, phase: 1.7 },
           { cx: 0.5, cz: 4.5, rx: 3.2, rz: 2.4, speed: 0.26, phase: 4.8 }]
  };

  var fishKinds = [];
  var fishCount = 0;

  var _mBody = new THREE.Matrix4();
  var _mPart = new THREE.Matrix4();
  var _mTmp = new THREE.Matrix4();
  var _q = new THREE.Quaternion();
  var _e = new THREE.Euler();
  var _v = new THREE.Vector3();
  var _sc = new THREE.Vector3(1, 1, 1);

  (function stockFish() {
    for (var k = 0; k < FISH_KINDS.length; k++) {
      var cfg = FISH_KINDS[k];
      var items = [];

      if (cfg.name === 'silver') {
        for (var n = 0; n < 14; n++) {
          items.push({
            route: {
              cx: 6.0 + (Math.random() - 0.5) * 10.0,
              cz: 0.0 + (Math.random() - 0.5) * 8.0,
              rx: 3.4 + Math.random() * 3.4,
              rz: 2.4 + Math.random() * 2.4,
              speed: 0.30 + Math.random() * 0.22,
              phase: Math.random() * Math.PI * 2
            },
            bob: Math.random() * 6.0,
            small: true
          });
        }
      } else {
        var rs = FISH_ROUTES[cfg.name] || [];
        for (var j = 0; j < rs.length; j++) {
          items.push({ route: rs[j], bob: j * 1.7 + k * 0.6 });
        }
      }

      var parts = buildFishParts(cfg);
      var count = items.length;

      // 身体：贴图 + 顶点色（尾柄/下颌的柔和压暗）
      var bodyMat = new THREE.MeshBasicMaterial({
        map: fishSkin(cfg),
        vertexColors: true,
        color: new THREE.Color(1.26, 1.05, 1.01)
      });
      // 鳍与眼：顶点色（基本色已烘进顶点色）
      var partMat = new THREE.MeshBasicMaterial({
        vertexColors: true,
        side: THREE.DoubleSide,
        color: new THREE.Color(1.26, 1.05, 1.01)
      });

      var bodyIM = new THREE.InstancedMesh(parts.body, bodyMat, count);
      var staticIM = new THREE.InstancedMesh(parts.static, partMat, count);
      var tailIM = new THREE.InstancedMesh(parts.tail, partMat, count);
      var pecLIM = new THREE.InstancedMesh(parts.pecL, partMat, count);
      var pecRIM = new THREE.InstancedMesh(parts.pecR, partMat, count);

      var ims = [bodyIM, staticIM, tailIM, pecLIM, pecRIM];
      for (var m = 0; m < ims.length; m++) {
        ims[m].instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        ims[m].frustumCulled = false;
        fishRoot.add(ims[m]);
      }

      fishKinds.push({
        cfg: cfg, bodyIM: bodyIM, staticIM: staticIM, tailIM: tailIM,
        pecLIM: pecLIM, pecRIM: pecRIM,
        items: items, tailOff: parts.tailOff,
        pecPivotL: parts.pecL.userData.pivot,
        pecPivotR: parts.pecR.userData.pivot
      });
      fishCount += count;
    }

    fishShadow = new THREE.InstancedMesh(shadowGeo, shadowMat, fishCount);
    fishShadow.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    fishShadow.frustumCulled = false;
    fishRoot.add(fishShadow);
  })();

  // 鱼的深度：略低于水面，避免在浅滩上"浮在沙子上"
  var FISH_BELOW_SURFACE = 1.6;

  function updateFish(t) {
    var idx = 0;
    for (var k = 0; k < fishKinds.length; k++) {
      var K = fishKinds[k];
      var cfg = K.cfg;
      for (var i = 0; i < K.items.length; i++) {
        var it = K.items[i];
        var rt = it.route;
        var a = rt.phase + t * rt.speed;
        var x = rt.cx + rt.rx * Math.cos(a);
        var z = rt.cz + rt.rz * Math.sin(a);

        // 巡游方向 → 朝向
        var vx = -rt.rx * Math.sin(a);
        var vz = rt.rz * Math.cos(a);
        var yaw = Math.atan2(-vz, vx);

        // 悬停在接近水面的位置；浅处则贴住沙床上方
        var bed = seabedY(x, z);
        var y = -FISH_BELOW_SURFACE + Math.sin(t * 0.8 + it.bob) * (it.small ? 0.06 : 0.10);
        var minY = bed + cfg.hgt * 0.75;
        if (y < minY) y = minY;

        _v.set(x, y, z);
        _e.set(Math.sin(t * 0.6 + it.bob) * 0.05, yaw, Math.sin(a * 2.0 + it.bob) * 0.10);
        _q.setFromEuler(_e);
        _mBody.compose(_v, _q, _sc);

        K.bodyIM.setMatrixAt(i, _mBody);
        K.staticIM.setMatrixAt(i, _mBody);

        // 尾鳍：以尾柄为轴左右摆
        var wag = Math.sin(t * (it.small ? 9.0 : 6.2) + it.bob * 3.0);
        _mPart.makeRotationY(wag * (it.small ? 0.40 : 0.30));
        _mPart.setPosition(-K.tailOff, 0, 0);
        _mTmp.multiplyMatrices(_mBody, _mPart);
        K.tailIM.setMatrixAt(i, _mTmp);

        // 胸鳍：绕自身根部上下轻扇
        var flap = Math.sin(t * (it.small ? 7.5 : 5.2) + it.bob * 2.0) * (it.small ? 0.30 : 0.24);

        var pL = K.pecPivotL;
        _mPart.makeRotationX(flap);
        _mPart.setPosition(pL.x, pL.y, pL.z);
        _mTmp.multiplyMatrices(_mBody, _mPart);
        K.pecLIM.setMatrixAt(i, _mTmp);

        var pR = K.pecPivotR;
        _mPart.makeRotationX(-flap);
        _mPart.setPosition(pR.x, pR.y, pR.z);
        _mTmp.multiplyMatrices(_mBody, _mPart);
        K.pecRIM.setMatrixAt(i, _mTmp);

        // 鱼影
        _v.set(x, bed + 0.035, z);
        _e.set(0, yaw, 0);
        _q.setFromEuler(_e);
        _sc.set(cfg.len * 0.42, 1, cfg.hgt * 0.46);
        _mBody.compose(_v, _q, _sc);
        fishShadow.setMatrixAt(idx++, _mBody);
        _sc.set(1, 1, 1);
      }

      K.bodyIM.instanceMatrix.needsUpdate = true;
      K.staticIM.instanceMatrix.needsUpdate = true;
      K.tailIM.instanceMatrix.needsUpdate = true;
      K.pecLIM.instanceMatrix.needsUpdate = true;
      K.pecRIM.instanceMatrix.needsUpdate = true;
    }
    fishShadow.instanceMatrix.needsUpdate = true;
  }

  /* =========================================================
     主循环
     ========================================================= */
  var last = performance.now() / 1000;
  var tAcc = 0;
  var seeded = false;

  /* =========================================================
     点击水面：投下涟漪
     ========================================================= */
  // 活跃涟漪列表（最多 4 个）。每帧整理成紧凑的 uRip[0..n-1]，
  // 着色器只需循环 n 次；没有涟漪时 n=0，整段逻辑被 early-out 跳过。
  var rippleList = [];
  var RIPPLE_LIFE = 7.0;
  var tmpRay = new THREE.Ray();
  var tmpPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  var ndc = new THREE.Vector2();
  var hitPoint = new THREE.Vector3();

  function addRipple(clientX, clientY) {
    var rect = renderer.domElement.getBoundingClientRect();
    ndc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    ndc.y = -((clientY - rect.top) / rect.height) * 2 + 1;

    // 从相机射向 y=0 平面
    tmpRay.origin.copy(camera.position);
    tmpRay.direction.set(ndc.x, ndc.y, 0.5).unproject(camera).sub(camera.position).normalize();
    if (!tmpRay.intersectPlane(tmpPlane, hitPoint)) return;

    // 只在水面上生效（沙滩上点击不产生涟漪）
    if (shoreDJS(hitPoint.x, hitPoint.z) < 0.4) return;

    if (rippleList.length >= 4) rippleList.shift();
    rippleList.push({ x: hitPoint.x, z: hitPoint.z, t0: tAcc, w: 1.6 });
  }

  function syncRipples(t) {
    // 丢弃过期项
    var n = 0;
    for (var i = 0; i < rippleList.length; i++) {
      if (t - rippleList[i].t0 < RIPPLE_LIFE) rippleList[n++] = rippleList[i];
    }
    rippleList.length = n;

    var arr = U.uRip.value;
    for (var j = 0; j < n; j++) {
      var rp = rippleList[j];
      arr[j].set(rp.x, rp.z, rp.t0, rp.w);
    }
    U.uRipN.value = n;
  }

  function onPointerDown(ev) {
    // 触摸与鼠标都支持
    addRipple(ev.clientX, ev.clientY);
  }
  window.addEventListener('pointerdown', onPointerDown, { passive: true });

  /* =========================================================
     自适应分辨率：帧率持续偏低就降一倍率，回升后再慢慢补回来
     ========================================================= */
  var quality = {
    ratio: pixelRatio,
    min: 0.6,
    // 上限 1.0：这是 3D 场景而不是文字界面，1x 已经很清晰；
    // 在 2x DPR 屏上跑 2x 渲染等于 4 倍像素，是之前卡顿的主因。
    max: 1.0,
    acc: 0,      // 累计帧时间
    frames: 0,
    cooldown: 60 // 调整后等一段时间再做下一次判断，避免抖动
  };

  function tuneQuality(dtMs) {
    if (quality.cooldown > 0) { quality.cooldown--; return; }
    quality.acc += dtMs;
    quality.frames++;
    if (quality.frames < 40) return;

    var avg = quality.acc / quality.frames;
    quality.acc = 0;
    quality.frames = 0;

    if (avg > 22 && quality.ratio > quality.min) {
      quality.ratio = Math.max(quality.min, quality.ratio - 0.2);
      renderer.setPixelRatio(quality.ratio);
      resize();
      quality.cooldown = 60;
    } else if (avg < 12 && quality.ratio < quality.max) {
      quality.ratio = Math.min(quality.max, quality.ratio + 0.2);
      renderer.setPixelRatio(quality.ratio);
      resize();
      quality.cooldown = 120;
    }
  }

  function frame() {
    requestAnimationFrame(frame);

    var now = performance.now() / 1000;
    var dt = Math.min(now - last, 0.05);
    last = now;
    tAcc += dt;
    U.uTime.value = tAcc;

    tuneQuality(dt * 1000);

    if (!seeded) {
      seeded = true;
      // 初始投几颗扰动，避免水面一开始死板
      var drops = simMat.uniforms.uDrops.value;
      for (var i = 0; i < drops.length; i++) {
        drops[i].set(Math.random(), Math.random(), 0.0016, 0.05 + Math.random() * 0.05);
      }
      stepSim();
      updateDrops(tAcc);
    }

    updateDrops(tAcc);
    stepSim();
    syncRipples(tAcc);

    // ---- 棕榈树摇曳：树干轻摆 + 每片叶子独立起伏，阴影同步偏移 ----
    var t = tAcc;
    var leanZ = Math.sin(t * 0.55) * 0.022 + Math.sin(t * 1.23 + 1.4) * 0.009;
    var leanX = Math.cos(t * 0.42 + 0.6) * 0.020 + Math.sin(t * 0.97) * 0.008;
    palmRoot.rotation.z = leanZ;
    palmRoot.rotation.x = leanX;
    // 树冠顶端的水平位移，用来同步阴影
    U.uSway.value.set(-leanZ * PALM_HEIGHT, leanX * PALM_HEIGHT);

    for (var f = 0; f < fronds.length; f++) {
      var fd = fronds[f];
      var ph = fd.userData.phase;
      fd.rotation.z = fd.userData.baseZ +
        Math.sin(t * 1.45 + ph) * fd.userData.amp +
        Math.sin(t * 2.9 + ph * 1.7) * fd.userData.amp * 0.35;
      fd.rotation.x = fd.userData.baseX +
        Math.cos(t * 1.15 + ph * 0.8) * fd.userData.amp * 0.6;
    }

    // ---- 鱼群游动 ----
    updateFish(tAcc);

    // 波场与阴影图都要在渲染之前更新（两个 pass 都会用到）
    bakeWave();
    bakeShadow();

    // pass 1: 海床 / 沙滩 / 鱼 → 折射贴图
    water.visible = false;
    palmRoot.visible = false;
    fishRoot.visible = true;
    renderer.setRenderTarget(rtScene);
    renderer.clear(true, true, false);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);

    // pass 2: 正式画面（鱼由水面的折射与吸收合成，所以这里隐藏）
    water.visible = true;
    palmRoot.visible = true;
    fishRoot.visible = false;
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', resize);

  /* =========================================================
     棕榈阴影图：每帧把 palmShadow 渲进一张小贴图
     ========================================================= */
  var SHADOW_R = 22;
  var SHADOW_N = 384;
  var shadowRT = new THREE.WebGLRenderTarget(SHADOW_N, SHADOW_N, {
    minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter,
    format: THREE.RGBAFormat,
    type: THREE.UnsignedByteType,
    wrapS: THREE.ClampToEdgeWrapping,
    wrapT: THREE.ClampToEdgeWrapping,
    depthBuffer: false,
    stencilBuffer: false
  });
  U.uShadow.value = shadowRT.texture;
  U.uShadowXf.value.z = 1 / (2 * SHADOW_R);

  var shadowBakeMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: U.uTime,
      uSunDir: U.uSunDir,
      uPalmBase: U.uPalmBase,
      uPalmTop: U.uPalmTop,
      uPalmHeight: U.uPalmHeight,
      uSway: U.uSway,
      uShadowC: { value: new THREE.Vector2() },
      uR: { value: SHADOW_R }
    },
    vertexShader: [
      'varying vec2 vUv;',
      'void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }'
    ].join('\n'),
    fragmentShader: [
      GLSL_UNIFORMS,
      GLSL_NOISE,
      GLSL_SHADOW,
      'uniform vec2 uShadowC;',
      'uniform float uR;',
      'varying vec2 vUv;',
      'void main(){',
      '  vec2 q = uShadowC + (vUv - 0.5) * 2.0 * uR;',
      '  gl_FragColor = vec4(palmShadow(q), 0.0, 0.0, 1.0);',
      '}'
    ].join('\n'),
    depthTest: false,
    depthWrite: false
  });

  var shadowScene = new THREE.Scene();
  var shadowCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  shadowScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), shadowBakeMat));

  function bakeShadow() {
    // 阴影中心跟着太阳方向与摇曳走
    var sx = PALM.x + PALM_TOP.x + U.uSway.value.x
           - (SUN.x / SUN.y) * PALM_HEIGHT;
    var sz = PALM.z + PALM_TOP.y + U.uSway.value.y
           - (SUN.z / SUN.y) * PALM_HEIGHT;
    U.uShadowXf.value.x = sx;
    U.uShadowXf.value.y = sz;
    shadowBakeMat.uniforms.uShadowC.value.set(sx, sz);

    renderer.setRenderTarget(shadowRT);
    renderer.clear(true, false, false);
    renderer.render(shadowScene, shadowCam);
    renderer.setRenderTarget(null);
  }

  // 先烘焙地形数据（水面与沙滩的着色器都依赖它），再构建并预烘焙波场
  bakeTerrain();
  buildWaveBake();
  bakeShadow();
  bakeWave();

  // 首帧预热，避免第一帧阴影/噪声有跳变
  stepSim();
  frame();
})();
</script>
