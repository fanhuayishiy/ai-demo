  <path d="M90 902H1030" stroke="#dedfd5"/>
  <text x="90" y="926" font-size="11" fill="#879087">原创演示户型 · 分区尺寸为示意，不作为施工图 · 三维家具与设备均为程序化模型</text>
  <text x="1030" y="926" text-anchor="end" font-size="11" fill="#879087">12.0 × 9.0 m / 108 m²</text>
</svg>
