<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="940" viewBox="0 0 1120 940" role="img" aria-labelledby="title desc">
  <title id="title">栖居 Habitat · 108 平方米示例户型</title>
  <desc id="desc">12 米乘 9 米的原创示例户型，包含主卧、书房、客厅、餐厨、卫浴和阳台。分区和交互三维模型的平面坐标一致。</desc>
  <defs>
    <pattern id="wood" width="72" height="18" patternUnits="userSpaceOnUse"><rect width="72" height="18" fill="#e9ddcd"/><path d="M0 18H72M36 0V18" stroke="#d9c9b6" stroke-width=".7"/></pattern>
    <pattern id="tile" width="30" height="30" patternUnits="userSpaceOnUse"><rect width="30" height="30" fill="#e3e6df"/><path d="M0 30V0H30" fill="none" stroke="#cbd1c7" stroke-width=".7"/></pattern>
    <style>text{font-family:Inter,'Segoe UI','Microsoft YaHei',sans-serif}.room{font-size:19px;fill:#35463c;font-weight:600;letter-spacing:2px}.sub{font-size:12px;fill:#7b847c}.dim{font-size:13px;fill:#6a756e}.furniture{stroke:#a99e90;stroke-width:1.2}.rule{stroke:#a1aba3;stroke-width:1;fill:none}</style>
  </defs>
  <rect width="1120" height="940" fill="#f6f5ee"/>
  <text x="90" y="75" font-size="15" font-weight="600" fill="#668173" letter-spacing="6">HABITAT / 栖居</text>
  <text x="90" y="124" font-size="34" font-weight="600" fill="#273e31">家的另一种视角</text>
  <text x="90" y="153" font-size="13" fill="#879087">ORIGINAL CONCEPT FLOOR PLAN · 108 m²</text>
  <text x="1030" y="112" text-anchor="end" font-size="14" fill="#6d8172">示例户型 / 01</text>
  <path d="M90 177H1030" stroke="#dedfd5"/>
