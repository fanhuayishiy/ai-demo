<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智慧校园数据看板 · Campus Digital Twin</title>
<style>
  :root {
    --ink: #1e2a32;
    --ink-soft: #5d6f7a;
    --line: rgba(30, 42, 50, 0.12);
    --panel: rgba(255, 255, 255, 0.82);
    --accent: #2c6e8f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe0ea; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  .panel {
    position: fixed;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    backdrop-filter: blur(10px);
    box-shadow: 0 6px 24px rgba(20, 40, 55, 0.10);
  }
  .topbar {
    top: 14px; left: 14px; right: 14px; z-index: 6;
    min-height: 68px; padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 18px;
    border-radius: 14px; background: rgba(255, 255, 255, 0.60);
    border: 1px solid rgba(255, 255, 255, 0.58);
    backdrop-filter: blur(14px) saturate(1.18);
    box-shadow: 0 10px 34px rgba(20, 40, 55, 0.12);
  }
  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center;
    color: #fff; font-size: 15px; font-weight: 700;
    background: linear-gradient(145deg, #2c6e8f, #55a88b);
    box-shadow: 0 8px 18px rgba(44, 110, 143, 0.24);
  }
  .brand h1 { margin: 0; font-size: 16px; letter-spacing: 0.2px; font-weight: 680; white-space: nowrap; }
  .brand p { margin: 3px 0 0; font-size: 9.5px; color: var(--ink-soft); letter-spacing: 0.75px; white-space: nowrap; }
  .scene-chips { display: flex; gap: 6px; margin-left: 4px; padding-left: 12px; border-left: 1px solid var(--line); }
  .chip {
    display: flex; align-items: center; gap: 4px; font-size: 9.5px; color: var(--ink-soft);
    padding: 4px 7px; border-radius: 8px; background: rgba(255, 255, 255, 0.48);
    border: 1px solid rgba(255, 255, 255, 0.42);
  }
  .chip b { color: var(--accent); font-size: 11px; font-weight: 680; }
  .topbar-stats { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .metric {
    min-width: 130px; padding: 7px 10px; border-radius: 11px;
    background: rgba(255, 255, 255, 0.52); border: 1px solid rgba(255, 255, 255, 0.48);
    display: flex; align-items: center; gap: 8px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; box-shadow: 0 0 12px currentColor; }
  .dot.blue { color: #2c6e8f; background: #2c6e8f; }
  .dot.green { color: #2f9d66; background: #2f9d66; }
  .dot.orange { color: #e6943c; background: #e6943c; }
  .metric-copy { display: flex; flex-direction: column; line-height: 1.05; }
  .metric-label { font-size: 9px; color: var(--ink-soft); letter-spacing: 0.25px; }
  .metric-value { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .dashboard {
    position: fixed; top: 94px; left: 14px; width: 292px; z-index: 5;
    max-height: calc(100vh - 184px); overflow-y: auto;
    display: flex; flex-direction: column; gap: 10px; padding: 2px 3px 2px 2px;
    scrollbar-width: thin; scrollbar-color: rgba(44, 110, 143, 0.28) transparent;
  }
  .dashboard::-webkit-scrollbar { width: 5px; }
  .dashboard::-webkit-scrollbar-thumb { background: rgba(44, 110, 143, 0.28); border-radius: 99px; }
  .chart-card {
    position: relative; padding: 12px 12px 11px; border-radius: 14px;
    background: rgba(255, 255, 255, 0.58); border: 1px solid rgba(255, 255, 255, 0.52);
    backdrop-filter: blur(10px); box-shadow: 0 8px 26px rgba(20, 40, 55, 0.09);
  }
  .card-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 9px; }
  .card-title h3 { margin: 0; font-size: 11.5px; font-weight: 650; letter-spacing: 0.2px; white-space: nowrap; }
  .card-title span { font-size: 9px; color: var(--ink-soft); opacity: 0.82; }
  .chart-wrap { height: 154px; }
  .chart-wrap.doughnut { height: 148px; }
  .modes { top: 94px; right: 14px; padding: 9px 10px; display: flex; align-items: center; gap: 7px; border-radius: 12px; }
  .dock { bottom: 18px; left: 18px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; max-width: 620px; }
  .btn {
    font: inherit; font-size: 12px; color: var(--ink);
    padding: 7px 12px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--line); background: rgba(255, 255, 255, 0.9);
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .btn:hover { background: #fff; border-color: rgba(44, 110, 143, 0.4); }
  .btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .sun { display: flex; align-items: center; gap: 9px; padding-left: 4px; }
  .sun label { font-size: 11.5px; color: var(--ink-soft); white-space: nowrap; }
  .sun output { font-size: 11.5px; color: var(--accent); font-variant-numeric: tabular-nums; width: 42px; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 132px; height: 3px;
    border-radius: 3px; background: linear-gradient(90deg, #f0b46a, #d8e8f0, #f0b46a); outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%;
    background: #fff; border: 2px solid var(--accent); cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%; background: #fff;
    border: 2px solid var(--accent); cursor: pointer;
  }
  .tip { bottom: 18px; right: 18px; padding: 9px 13px; font-size: 11px; color: var(--ink-soft); letter-spacing: 0.2px; }
  .tip span + span::before { content: "·"; margin: 0 7px; color: rgba(93, 111, 122, 0.5); }
  #tip3d {
    position: fixed; z-index: 12; pointer-events: none; opacity: 0;
    padding: 7px 10px; border-radius: 8px; font-size: 11.5px; font-weight: 650; color: #f4f8fa;
    background: rgba(18, 30, 38, 0.72); border: 1px solid rgba(255, 255, 255, 0.16);
    box-shadow: 0 8px 22px rgba(10, 20, 30, 0.18); backdrop-filter: blur(8px);
    transform: translate(12px, 14px) scale(0.97); transform-origin: left top;
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  #tip3d.on { opacity: 1; transform: translate(12px, 14px) scale(1); }
  #boot {
    position: fixed; inset: 0; z-index: 9; display: grid; place-items: center;
    background: linear-gradient(180deg, #e6f0f5, #cfdfe8); color: var(--ink-soft);
    font-size: 12.5px; letter-spacing: 1.5px; transition: opacity 0.6s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  @media (max-width: 1100px) {
    .topbar { flex-direction: column; align-items: stretch; }
    .topbar-stats { justify-content: flex-start; }
    .scene-chips { display: none; }
    .dashboard { width: 250px; top: 150px; max-height: calc(100vh - 230px); }
    .modes { top: 150px; right: 14px; }
  }
  @media (max-width: 720px) {
    .dashboard { display: none; }
    .modes { top: 150px; right: 12px; }
    .dock { left: 12px; right: 12px; bottom: 58px; max-width: none; }
    .tip { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="boot">正在构建校园场景…</div>
<header class="panel topbar">
  <div class="brand">
    <div class="brand-mark">校</div>
    <div>
      <h1>智慧校园数据看板</h1>
      <p>SMART CAMPUS DATA DASHBOARD</p>
    </div>
    <div class="scene-chips">
      <div class="chip"><b id="mBld">8</b>建筑</div>
      <div class="chip"><b id="mTree">0</b>树木</div>
      <div class="chip"><b id="mCar">0</b>车流</div>
      <div class="chip"><b id="mFps">60</b>FPS</div>
    </div>
  </div>
  <div class="topbar-stats">
    <div class="metric">
      <span class="dot blue"></span>
      <div class="metric-copy">
        <span class="metric-label">在校人数</span>

      </div>

    <div class="metric">
      <span class="dot green"></span>
      <div class="metric-copy">

        <span class="metric-value">1,240</span>
      </div>
    </div>
    <div class="metric">
      <span class="dot orange"></span>
      <div class="metric-copy">
        <span class="metric-label">建筑面积</span>
        <span class="metric-value">28.6万㎡</span>
      </div>
    </div>
  </div>
</header>
<aside class="dashboard">
  <section class="chart-card">
    <div class="card-title">
      <h3>📈 月度校园活跃度趋势</h3>
      <span>9月 - 8月</span>
    </div>
    <div class="chart-wrap"><canvas id="lineChart"></canvas></div>
  </section>
  <section class="chart-card">
    <div class="card-title">
      <h3>📊 各学院人数统计</h3>
      <span>7 个学院</span>
    </div>
    <div class="chart-wrap"><canvas id="barChart"></canvas></div>
  </section>
  <section class="chart-card">
    <div class="card-title">
      <h3>🥧 校园设施使用占比</h3>
      <span>6 类设施</span>
    </div>
    <div class="chart-wrap doughnut"><canvas id="doughnutChart"></canvas></div>
  </section>
</aside>
<div class="panel modes">
  <button class="btn" id="bCamera">切换透视</button>
  <button class="btn" id="bNight">切换夜景</button>
</div>
<div class="panel dock">
  <button class="btn" id="bRotate">自动巡航</button>
  <button class="btn" id="bReset">重置视角</button>
  <button class="btn on" id="bShadow">阴影</button>
  <button class="btn on" id="bPatch">草皮</button>
  <div class="sun">
    <label>日照</label>
    <input type="range" id="rSun" min="0" max="1" step="0.01" value="0.68" />
    <output id="oSun">15:31</output>
  </div>
</div>
<div class="panel tip">
  <span>左键拖拽旋转</span><span>滚轮缩放</span><span>右键平移</span>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Chart, registerables } from 'https://cdn.jsdelivr.net/npm/chart.js@4.4.4/+esm';
/* ============================================================
   0. 全局配置
   ============================================================ */
const PAL = {
  ground: 0x86ab6a,
  track: 0x3f7fcb,
  lane: 0xf3f7fa,
  wall: 0xf6f6f3,
  plinth: 0xd8dbd8,
  band: 0xbcc6c4,
  glass: 0xffffff,
  trunk: 0x7b5a3f,
  leaf: 0x4f8a4a,
  path: 0xe9e5da,
};
const TRACK = { w: 74, d: 46, r: 23, lanes: 8, laneW: 1.25 };
TRACK.width = TRACK.lanes * TRACK.laneW;
TRACK.in = { w: TRACK.w - TRACK.width * 2, d: TRACK.d - TRACK.width * 2, r: TRACK.r - TRACK.width };
const RING = { w: TRACK.w + 26, d: TRACK.d + 26, r: TRACK.r + 13, wide: 4.4 };
const CAMPUS = { w: 248, d: 206, r: 8 };
const GATE = { w: 20, z: CAMPUS.d / 2 };
const ROAD = { w: 212, d: 172, r: 53, wide: 13 };
const BUILDINGS = [
  { name: '图书馆', ang: 202, w: 30, d: 18, floors: 4, far: 1.02 },
  { name: '教学楼A', ang: 246, w: 26, d: 13, floors: 5, far: 1.00 },
  { name: '教学楼B', ang: 292, w: 24, d: 13, floors: 5, far: 1.06 },
  { name: '行政楼', ang: 336, w: 21, d: 15, floors: 6, far: 1.00 },
  { name: '科研楼', ang: 24, w: 18, d: 14, floors: 7, far: 1.08 },
  { name: '体育馆', ang: 68, w: 27, d: 20, floors: 2, far: 1.00 },
  { name: '学生公寓', ang: 112, w: 16, d: 12, floors: 8, far: 1.10 },
  { name: '食堂', ang: 156, w: 24, d: 14, floors: 2, far: 1.02 },
];
const ELLIPSE = { a: 70, b: 54 };
const H_PLINTH = 0.55, H_GROUND = 4.4, H_FLOOR = 3.15;
/* ============================================================
   1. 工具函数
   ============================================================ */
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), 1 | t);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(20260916);
const rand = (min, max) => min + rnd() * (max - min);
function radialDist(w, d, r, ux, uz) {
  const hw = w / 2, hd = d / 2;
  r = Math.min(r, hw, hd);
  const iw = hw - r, iz = hd - r;
  let best = Infinity;
  if (Math.abs(ux) > 1e-6) {
    const t = (ux > 0 ? hw : -hw) / ux, z = uz * t;
    if (Math.abs(z) <= iz) best = Math.min(best, t);
  }
  if (Math.abs(uz) > 1e-6) {
    const t = (uz > 0 ? hd : -hd) / uz, x = ux * t;
    if (Math.abs(x) <= iw) best = Math.min(best, t);
  }
  const cx = ux > 0 ? iw : -iw, cz = uz > 0 ? iz : -iz;
  const b = ux * cx + uz * cz, c = cx * cx + cz * cz - r * r, disc = b * b - c;
  if (disc > 0) {
    const t = b + Math.sqrt(disc);
    if (t > 0) best = Math.min(best, t);
  }
  return best;
}
function distToSeg(px, pz, ax, az, bx, bz) {
  const vx = bx - ax, vz = bz - az;
  const len = vx * vx + vz * vz || 1e-6;
  const t = Math.max(0, Math.min(1, ((px - ax) * vx + (pz - az) * vz) / len));
  return Math.hypot(px - (ax + vx * t), pz - (az + vz * t));
}
function roundedRectSamples(w, d, r, seg = 10) {
  const hw = w / 2, hd = d / 2;
  r = Math.max(0.01, Math.min(r, hw, hd));
  const pts = [];
  const line = (x1, y1, x2, y2) => {
    for (let i = 0; i < seg; i++) {
      const t = i / seg;
      pts.push(new THREE.Vector2(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t));
    }
  };
  const quad = (x1, y1, cx, cy, x2, y2) => {
    for (let i = 0; i < seg; i++) {
      const t = i / seg, u = 1 - t;
      pts.push(new THREE.Vector2(
        u * u * x1 + 2 * u * t * cx + t * t * x2,
        u * u * y1 + 2 * u * t * cy + t * t * y2,
      ));
    }
  };
  line(-hw + r, -hd, hw - r, -hd);
  quad(hw - r, -hd, hw, -hd, hw, -hd + r);
  line(hw, -hd + r, hw, hd - r);
  quad(hw, hd - r, hw, hd, hw - r, hd);
  line(hw - r, hd, -hw + r, hd);
  quad(-hw + r, hd, -hw, hd, -hw, hd - r);
  line(-hw, hd - r, -hw, -hd + r);
  quad(-hw, -hd + r, -hw, -hd, -hw + r, -hd);
  return pts;
}
function ringBand(w, d, r, from, to) {
  const outer = roundedRectSamples(w - from * 2, d - from * 2, r - from);
  const inner = roundedRectSamples(w - to * 2, d - to * 2, r - to);
  const n = outer.length, positions = [], normals = [], indices = [];
  for (let i = 0; i < n; i++) {
    positions.push(outer[i].x, 0, -outer[i].y, inner[i].x, 0, -inner[i].y);
    normals.push(0, 1, 0, 0, 1, 0);
  }
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n, a = i * 2, b = a + 1, c = j * 2, e = c + 1;
    indices.push(a, c, b, b, c, e);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  g.setIndex(indices);
  return g;
}
function flatMesh(geo, mat, y) {
  const m = new THREE.Mesh(geo, mat);
  m.position.y = y;
  m.receiveShadow = true;
  return m;
}
function box(w, h, d, mat, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}
function canvasTexture(w, h, draw, repeat = 1) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeat, repeat);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}
/* ============================================================
   2. 渲染器 / 等距相机 / OrbitControls
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
document.getElementById('app').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xdfeef6, 210, 620);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.05).texture;
scene.environmentIntensity = 1;
const FRUSTUM = 186;
let aspect = innerWidth / innerHeight;
const orthoCamera = new THREE.OrthographicCamera(
  (-FRUSTUM * aspect) / 2, (FRUSTUM * aspect) / 2, FRUSTUM / 2, -FRUSTUM / 2, 1, 2400
);
const perspectiveCamera = new THREE.PerspectiveCamera(40, aspect, 1, 2400);
let camera = orthoCamera;
const HOME = { pos: new THREE.Vector3(168, 146, 168), target: new THREE.Vector3(-13, 6, -13), zoom: 0.9 };
camera.position.copy(HOME.pos);
perspectiveCamera.position.copy(HOME.pos);
let controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME.target);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.minZoom = 0.55;
controls.maxZoom = 4.5;
controls.minPolarAngle = 0.12;
controls.maxPolarAngle = Math.PI * 0.47;
controls.autoRotateSpeed = 0.5;
controls.screenSpacePanning = false;
controls.update();
/* ============================================================
   3. 天空渐变 + Directional / Ambient / Hemisphere 光照
   ============================================================ */
const skyMat = new THREE.ShaderMaterial({
  uniforms: {
    topColor: { value: new THREE.Color(0x86b6d6) },
    bottomColor: { value: new THREE.Color(0xe9f2f6) },
    offset: { value: 60 },
    exponent: { value: 0.72 },
  },
  vertexShader: [
    'varying vec3 vWorld;',
    'void main() {',
    '  vec4 wp = modelMatrix * vec4(position, 1.0);',
    '  vWorld = wp.xyz;',
    '  gl_Position = projectionMatrix * viewMatrix * wp;',
    '}',
  ].join('\n'),
  fragmentShader: [
    'uniform vec3 topColor;',
    'uniform vec3 bottomColor;',
    'uniform float offset;',
    'uniform float exponent;',
    'varying vec3 vWorld;',
    'void main() {',
    '  float h = max(normalize(vWorld + vec3(0.0, offset, 0.0)).y, 0.0);',
    '  gl_FragColor = vec4(mix(bottomColor, topColor, pow(h, exponent)), 1.0);',
    '}',
  ].join('\n'),
  side: THREE.BackSide,
  depthWrite: false,
  fog: false,
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(900, 32, 18), skyMat));
const hemi = new THREE.HemisphereLight(0xcfe6f3, 0x8a9a72, 0.85);
scene.add(hemi);
const ambient = new THREE.AmbientLight(0xffffff, 0.2);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff3e2, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 80;
sun.shadow.camera.far = 760;
sun.shadow.camera.left = -170;
sun.shadow.camera.right = 170;
sun.shadow.camera.top = 170;
sun.shadow.camera.bottom = -170;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.05;
sun.shadow.radius = 2.2;
sun.position.set(150, 200, 110);
scene.add(sun, sun.target);
function applySun(t) {
  const elevDeg = 4 + 62 * Math.sin(Math.PI * t);
  const azimDeg = -104 + 208 * t;
  const elev = THREE.MathUtils.degToRad(elevDeg);
  const azim = THREE.MathUtils.degToRad(azimDeg);

      const dx = Math.abs(px - sx);

        if (side === 1) ctx.arc(sx, H / 2, arcR, -th, th);

{
  const COUNT = 350;

  function reset(i) {
    const j = i * 3, tier = ftier[i], a = Math.random() * Math.PI * 2;
    if (tier === 0) {
      const rr = Math.random() * 0.16;
      fpos[j] = Math.cos(a) * rr;

      fpos[j + 2] = Math.sin(a) * rr;

      fvel[j] = Math.cos(a) * rand(1.4, 2.8);
      fvel[j + 1] = sp;
      fvel[j + 2] = Math.sin(a) * rand(1.4, 2.8);
    } else if (tier === 1) {
      const rr = rand(1.28, 1.4);
      fpos[j] = Math.cos(a) * rr;
      fpos[j + 1] = 4.42;
      fpos[j + 2] = Math.sin(a) * rr;
      const sp = rand(1.8, 2.8);
      fvel[j] = Math.cos(a) * sp;
      fvel[j + 1] = rand(0.35, 1.05);
      fvel[j + 2] = Math.sin(a) * sp;
    } else {
      const rr = rand(2.5, 2.66);
      fpos[j] = Math.cos(a) * rr;
      fpos[j + 1] = 3.0;
      fpos[j + 2] = Math.sin(a) * rr;
      const sp = rand(2.1, 3.2);
      fvel[j] = Math.cos(a) * sp;
      fvel[j + 1] = rand(0.15, 0.7);
      fvel[j + 2] = Math.sin(a) * sp;
    }
  }
  for (let i = 0; i < COUNT; i++) {
    ftier[i] = i < 110 ? 0 : i < 220 ? 1 : 2;
    reset(i);
  }
  const fgeo = new THREE.BufferGeometry();
  fgeo.setAttribute('position', new THREE.BufferAttribute(fpos, 3));
  const dropTex = canvasTexture(64, 64, (ctx, S) => {
    ctx.clearRect(0, 0, S, S);
    const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.35, 'rgba(224,244,255,0.72)');
    g.addColorStop(1, 'rgba(184,224,255,0)');
    ctx.fillStyle = g;

    for (let i = 0; i < COUNT; i++) {

      fvel[j + 1] -= 9.0 * dt;
      fpos[j] += fvel[j] * dt;
      fpos[j + 1] += fvel[j + 1] * dt;
      fpos[j + 2] += fvel[j + 2] * dt;

  };
}

{

        const v = createVehicle(CAR_COLORS[idx++ % CAR_COLORS.length]);
        scene.add(v.g);

          axis: rd.axis, fixed: rd.fixed, dir,

function updateVehicles(dt) {
  const half = CITY.len / 2;
  for (const v of vehicles) {
    v.t += v.dir * v.speed * dt;
    if (v.t > half) v.t = -half;
    else if (v.t < -half) v.t = half;
    const off = (v.axis === 'x' ? 1 : -1) * v.dir * 1.9;
    if (v.axis === 'x') {
      v.g.position.set(v.fixed + off, 0, v.t);
      v.g.rotation.y = v.dir > 0 ? 0 : Math.PI;
    } else {
      v.g.position.set(v.t, 0, v.fixed + off);
      v.g.rotation.y = v.dir > 0 ? Math.PI / 2 : -Math.PI / 2;
    }
    const w = (v.speed * dt) / 0.38;
    for (const m of v.wheels) m.rotation.x += w;
  }
}

  hoverPointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  hoverRaycaster.setFromCamera(hoverPointer, camera);
  const hits = hoverRaycaster.intersectObjects(hoverTargets, true);
  let label = '';
  if (hits.length) {
    let owner = hits[0].object;
    while (owner && !owner.userData?.label) owner = owner.parent;
    label = owner?.userData?.label || '';
  }
  const hasHit = !!label;
  buildingTip.textContent = label || '周边建筑';
  buildingTip.classList.toggle('on', hasHit);
  if (hasHit) {
    const tx = Math.min(event.clientX + 12, innerWidth - buildingTip.offsetWidth - 12);
    const ty = Math.min(event.clientY + 14, innerHeight - buildingTip.offsetHeight - 12);
    buildingTip.style.left = `${Math.max(12, tx)}px`;
    buildingTip.style.top = `${Math.max(12, ty)}px`;
  }
  renderer.domElement.style.cursor = hasHit ? 'pointer' : 'grab';
});

const mFps = document.getElementById('mFps');
let last = performance.now(), frames = 0, acc = 0;
renderer.setAnimationLoop(() => {
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.05);
  frames++; acc += now - last; last = now;
  controls.update();
  updateFlag(dt);
  if (updateFountain) updateFountain(dt);
  updateVehicles(dt);
  renderer.render(scene, camera);
  if (acc > 900) {
    mFps.textContent = Math.round((frames * 1000) / acc);
    frames = 0; acc = 0;
  }
});
